  <script>
const DB = (() => {
  const DB_NAME = 'autolister-v1';
  const VERSION = 1;
  const STORES = ['vehicles','listings','locations','analytics','settings'];
  let db = null;
  let useMemory = false;
  const memory = Object.fromEntries(STORES.map(n => [n, new Map()]));

  function openIndexedDB(){
    return new Promise((resolve,reject)=>{
      try {
        if (!('indexedDB' in window)) return reject(new Error('IndexedDB unavailable'));
        if(db) return resolve(db);
        const req=indexedDB.open(DB_NAME,VERSION);
        req.onupgradeneeded=()=>{
          const d=req.result;
          STORES.forEach(name=>{
            if(!d.objectStoreNames.contains(name)){
              const s=d.createObjectStore(name,{keyPath:'id'});
              if(name==='analytics') s.createIndex('listingId','listingId',{unique:false});
              if(name==='listings') s.createIndex('vehicleId','vehicleId',{unique:false});
            }
          });
        };
        req.onsuccess=()=>{db=req.result;resolve(db)};
        req.onerror=()=>reject(req.error || new Error('IndexedDB failed'));
        req.onblocked=()=>reject(new Error('IndexedDB blocked'));
      } catch(err) { reject(err); }
    });
  }

  async function open(){
    if(useMemory) return null;
    try { return await openIndexedDB(); }
    catch(err){
      console.warn('LotKeys: IndexedDB unavailable in this local-file mode; using temporary in-memory storage.', err);
      useMemory=true;
      return null;
    }
  }

  async function store(name,mode='readonly'){
    const d=await open();
    if(useMemory) return null;
    return d.transaction(name,mode).objectStore(name);
  }

  async function all(name){
    await open();
    if(useMemory) return Array.from(memory[name].values());
    return new Promise(async(res,rej)=>{const r=(await store(name)).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  }
  async function get(name,id){
    await open();
    if(useMemory) return memory[name].get(id);
    return new Promise(async(res,rej)=>{const r=(await store(name)).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  }
  async function put(name,value){
    await open();
    if(useMemory){memory[name].set(value.id,value);return value;}
    return new Promise(async(res,rej)=>{const r=(await store(name,'readwrite')).put(value);r.onsuccess=()=>res(value);r.onerror=()=>rej(r.error)});
  }
  async function del(name,id){
    await open();
    if(useMemory){memory[name].delete(id);return;}
    return new Promise(async(res,rej)=>{const r=(await store(name,'readwrite')).delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)});
  }
  async function clear(name){
    await open();
    if(useMemory){memory[name].clear();return;}
    return new Promise(async(res,rej)=>{const r=(await store(name,'readwrite')).clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error)});
  }
  async function byIndex(name,index,key){
    await open();
    if(useMemory){
      return Array.from(memory[name].values()).filter(v=>v && v[index]===key);
    }
    return new Promise(async(res,rej)=>{const s=await store(name);const r=s.index(index).getAll(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  }
  function isTemporary(){ return useMemory; }
  return {open,all,get,put,del,clear,byIndex,isTemporary};
})();
  </script>
  
<script>
const DriveSync = (() => {
  const FOLDER_MIME = 'application/vnd.google-apps.folder';
  const SHEET_MIME = 'application/vnd.google-apps.spreadsheet';
  const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
  let accessToken = '';
  let expiresAt = 0;
  let tokenClient = null;
  let tokenClientId = '';
  let pickerPromise = null;

  async function setting(id, def=''){ return (await DB.get('settings',id))?.value ?? def; }
  async function setSetting(id,value){ return DB.put('settings',{id,value}); }
  function now(){ return Date.now(); }
  function qEscape(s){ return String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
  function isHttps(){ return location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1'; }
  async function config(){
    return {
      clientId: (await setting('googleClientId','')).trim(),
      apiKey: (await setting('googleApiKey','')).trim(),
      projectNumber: String(await setting('googleProjectNumber','')).trim(),
      storeFolderId: (await setting('storeFolderId','')).trim(),
      storeFolderName: (await setting('storeFolderName','')).trim(),
      userName: (await setting('userName','')).trim(),
      storeName: (await setting('storeName','')).trim(),
      publicShareEnabled: await setting('publicShareEnabled', true),
    };
  }
  async function waitForGoogle(timeoutMs=12000){
    const start=now();
    while(now()-start < timeoutMs){
      if(window.google?.accounts?.oauth2 && window.gapi) return;
      await new Promise(r=>setTimeout(r,100));
    }
    throw new Error('Google sign-in libraries did not load. Check your internet connection and reload LotKeys.');
  }
  async function initPicker(){
    if(pickerPromise) return pickerPromise;
    pickerPromise=(async()=>{
      await waitForGoogle();
      await new Promise((resolve,reject)=>{
        try { gapi.load('picker',{callback:resolve,onerror:()=>reject(new Error('Google Picker failed to load'))}); }
        catch(e){ reject(e); }
      });
      return true;
    })();
    return pickerPromise;
  }
  async function authorize(forcePrompt=false){
    const c=await config();
    if(!isHttps()) throw new Error('Google authorization requires HTTPS (or localhost). Host this build first, then open that URL.');
    if(!c.clientId) throw new Error('Google OAuth Client ID is not configured in Settings.');
    await waitForGoogle();
    if(accessToken && expiresAt-now()>60000 && !forcePrompt) return accessToken;
    if(!tokenClient || tokenClientId!==c.clientId){
      tokenClientId=c.clientId;
      tokenClient=google.accounts.oauth2.initTokenClient({client_id:c.clientId,scope:DRIVE_SCOPE,callback:()=>{}});
    }
    return new Promise((resolve,reject)=>{
      tokenClient.callback=resp=>{
        if(resp?.error) return reject(new Error(resp.error_description || resp.error));
        accessToken=resp.access_token;
        expiresAt=now()+(Number(resp.expires_in||3600)*1000);
        resolve(accessToken);
      };
      tokenClient.error_callback=err=>reject(new Error(err?.message || err?.type || 'Google authorization was cancelled.'));
      tokenClient.requestAccessToken({prompt: forcePrompt || !accessToken ? 'consent' : ''});
    });
  }
  function connected(){ return !!(accessToken && expiresAt-now()>60000); }
  async function ready(){ const c=await config(); return !!(c.clientId && c.storeFolderId && c.userName); }
  async function disconnect(){
    if(accessToken && window.google?.accounts?.oauth2){ try{ google.accounts.oauth2.revoke(accessToken,()=>{}); }catch{} }
    accessToken='';expiresAt=0;
  }
  async function apiFetch(url, opts={}, retry=true){
    const token=await authorize(false);
    const headers=new Headers(opts.headers||{}); headers.set('Authorization',`Bearer ${token}`);
    const res=await fetch(url,{...opts,headers});
    if(res.status===401 && retry){ accessToken='';expiresAt=0;await authorize(true);return apiFetch(url,opts,false); }
    if(!res.ok){
      let detail='';try{const j=await res.json();detail=j?.error?.message||JSON.stringify(j);}catch{detail=await res.text();}
      const e=new Error(detail||`Google API request failed (${res.status})`); e.status=res.status; throw e;
    }
    if(res.status===204) return null;
    const type=res.headers.get('content-type')||'';
    return type.includes('application/json') ? res.json() : res.text();
  }
  async function driveGet(id,fields='id,name,mimeType,webViewLink,appProperties,parents,driveId'){
    return apiFetch(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(id)}?supportsAllDrives=true&fields=${encodeURIComponent(fields)}`);
  }
  async function listFiles(q,fields='files(id,name,mimeType,webViewLink,appProperties,parents,trashed)'){
    const u=new URL('https://www.googleapis.com/drive/v3/files');
    u.searchParams.set('q',q);u.searchParams.set('fields',fields);u.searchParams.set('pageSize','1000');
    u.searchParams.set('supportsAllDrives','true');u.searchParams.set('includeItemsFromAllDrives','true');
    return (await apiFetch(u.toString())).files||[];
  }
  async function createMetadata(meta,fields='id,name,mimeType,webViewLink,appProperties'){
    return apiFetch(`https://www.googleapis.com/drive/v3/files?supportsAllDrives=true&fields=${encodeURIComponent(fields)}`,{
      method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(meta)
    });
  }
  async function patchMetadata(id,meta,fields='id,name,webViewLink,appProperties'){
    return apiFetch(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(id)}?supportsAllDrives=true&fields=${encodeURIComponent(fields)}`,{
      method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(meta)
    });
  }
  async function trashFile(id){ if(!id)return; return patchMetadata(id,{trashed:true},'id,trashed'); }
  async function createFolder(name,parentId,appProperties={}){
    return createMetadata({name,mimeType:FOLDER_MIME,parents:[parentId],appProperties});
  }
  async function findChildByName(parentId,name,mimeType=''){
    let q=`'${qEscape(parentId)}' in parents and name = '${qEscape(name)}' and trashed = false`;
    if(mimeType) q+=` and mimeType = '${qEscape(mimeType)}'`;
    return (await listFiles(q))[0]||null;
  }
  async function findChildByAppProperty(parentId,key,value,mimeType=''){
    let q=`'${qEscape(parentId)}' in parents and appProperties has { key='${qEscape(key)}' and value='${qEscape(value)}' } and trashed = false`;
    if(mimeType) q+=` and mimeType = '${qEscape(mimeType)}'`;
    return (await listFiles(q))[0]||null;
  }
  async function ensureFolder(parentId,name,key='',value=''){
    let f=null;
    if(key && value) f=await findChildByAppProperty(parentId,key,value,FOLDER_MIME);
    if(!f) f=await findChildByName(parentId,name,FOLDER_MIME);
    if(!f) f=await createFolder(name,parentId,key&&value?{[key]:value}:{})
    else if(f.name!==name) f=await patchMetadata(f.id,{name});
    return f;
  }
  async function updateTextFile(fileId,blob){
    const token=await authorize(false);
    const res=await fetch(`https://www.googleapis.com/upload/drive/v3/files/${encodeURIComponent(fileId)}?uploadType=media&supportsAllDrives=true`,{
      method:'PATCH',headers:{Authorization:`Bearer ${token}`,'Content-Type':blob.type||'application/octet-stream'},body:blob
    });
    if(!res.ok){let d='';try{d=(await res.json())?.error?.message||''}catch{};throw new Error(d||`Could not update Drive file (${res.status})`)}
    return res.json();
  }
  async function multipartCreate(blob,metadata){
    const token=await authorize(false);
    const boundary='lotkeys_'+Math.random().toString(36).slice(2);
    const body=new Blob([
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n`,JSON.stringify(metadata),
      `\r\n--${boundary}\r\nContent-Type: ${blob.type||'application/octet-stream'}\r\n\r\n`,blob,`\r\n--${boundary}--`
    ]);
    const res=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&supportsAllDrives=true&fields=id,name,webViewLink,appProperties',{
      method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':`multipart/related; boundary=${boundary}`},body
    });
    if(!res.ok){let d='';try{d=(await res.json())?.error?.message||''}catch{};throw new Error(d||`Could not upload file (${res.status})`)}
    return res.json();
  }
  async function upsertJson({fileId='',name,parentId,data,appProperties={}}){
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    if(fileId){ await updateTextFile(fileId,blob); return driveGet(fileId,'id,name,webViewLink,appProperties'); }
    return multipartCreate(blob,{name,parents:[parentId],appProperties});
  }
  async function setAnyoneReader(folderId){
    const p=await apiFetch(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(folderId)}/permissions?supportsAllDrives=true&fields=permissions(id,type,role)`).catch(()=>({permissions:[]}));
    if((p.permissions||[]).some(x=>x.type==='anyone'&&x.role==='reader')) return true;
    await apiFetch(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(folderId)}/permissions?supportsAllDrives=true&fields=id,type,role`,{
      method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'anyone',role:'reader'})
    });
    return true;
  }
  async function ensureStoreStructure(){
    const c=await config();
    if(!c.storeFolderId) throw new Error('Choose a Store Folder first.');
    if(!c.userName) throw new Error('Enter your user name first.');
    await authorize(false);
    // Validate that the selected root is still available to this app/account.
    const root=await driveGet(c.storeFolderId,'id,name,mimeType,webViewLink,capabilities(canAddChildren,canListChildren)');
    if(root.mimeType!==FOLDER_MIME) throw new Error('The selected Store item is not a folder.');
    const users=await ensureFolder(root.id,'Users','lotkeysRole','users');
    const admin=await ensureFolder(root.id,'Administration','lotkeysRole','administration');
    const inventory=await ensureFolder(root.id,'Inventory','lotkeysRole','inventory');
    const user=await ensureFolder(users.id,c.userName,'lotkeysUserName',c.userName);
    const listings=await ensureFolder(user.id,'Listings','lotkeysRole','userListings');
    const structure={rootId:root.id,rootName:root.name,usersId:users.id,adminId:admin.id,inventoryId:inventory.id,userId:user.id,listingsId:listings.id,updatedAt:new Date().toISOString()};
    await setSetting('driveStoreStructure',structure);
    await syncStoreConfig(structure).catch(()=>{});
    return structure;
  }
  async function structure(){
    const s=await setting('driveStoreStructure',null); const c=await config();
    if(s?.rootId===c.storeFolderId && s?.inventoryId && s?.listingsId) return s;
    return ensureStoreStructure();
  }
  async function syncStoreConfig(existingStructure=null){
    const s=existingStructure||await structure();
    const c=await config();const locations=await DB.all('locations');
    const data={schemaVersion:2,app:'LotKeys',storeName:c.storeName,userName:c.userName,storeFolderId:c.storeFolderId,locations:locations.map(({id,name,address,lat,lng,updatedAt})=>({id,name,address,lat,lng,updatedAt})),updatedAt:new Date().toISOString()};
    let fileId=await setting('storeConfigFileId','');
    if(!fileId){ const found=await findChildByAppProperty(s.adminId,'lotkeysRole','storeConfig'); fileId=found?.id||''; }
    const f=await upsertJson({fileId,name:'LotKeys Store Config.json',parentId:s.adminId,data,appProperties:{lotkeysRole:'storeConfig'}});
    await setSetting('storeConfigFileId',f.id); return f;
  }
  async function createSpreadsheet(parentId,vehicleId){
    const found=await findChildByAppProperty(parentId,'lotkeysVehicleSheet',vehicleId,SHEET_MIME);
    if(found) return found;
    return createMetadata({name:'Vehicle Data - Administrative',mimeType:SHEET_MIME,parents:[parentId],appProperties:{lotkeysVehicleSheet:vehicleId}},'id,name,mimeType,webViewLink,appProperties');
  }
  async function writeVehicleSheet(sheetId,v){
    const d=v.drive||{};
    const values=[
      ['Field','Value'],
      ['Profile Name',v.name||''],['Year',v.year||''],['Make',v.make||''],['Model',v.model||''],['Price',v.price??''],
      ['Odometer',v.odometer??''],['Odometer Unit',v.odometerUnit||''],['VIN #',v.vin||''],['STK #',v.stock||''],
      ['Photos Folder',d.photosFolderId?`https://drive.google.com/drive/folders/${d.photosFolderId}`:''],
      ['Videos Folder',d.videosFolderId?`https://drive.google.com/drive/folders/${d.videosFolderId}`:''],
      ['Documents Folder',d.documentsFolderId?`https://drive.google.com/drive/folders/${d.documentsFolderId}`:''],
      ['Shared Folder',d.sharedFolderId?`https://drive.google.com/drive/folders/${d.sharedFolderId}`:''],
      ['Description',v.description||''],['Profile ID',v.id],['Cover Photo File ID',v.photos?.[0]?.driveFileId||''],['Updated',new Date().toISOString()]
    ];
    return apiFetch(`https://sheets.googleapis.com/v4/spreadsheets/${encodeURIComponent(sheetId)}/values/A1:B${values.length}?valueInputOption=RAW`,{
      method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({majorDimension:'ROWS',values})
    });
  }
  function safeName(name,fallback){
    const n=String(name||fallback||'file').replace(/[\\/:*?"<>|]/g,'-').trim();return n||fallback||'file';
  }
  async function syncAssets(items,folderId,vehicleId,kind){
    items=items||[];
    const remotes=await listFiles(`'${qEscape(folderId)}' in parents and trashed = false`,'files(id,name,mimeType,webViewLink,appProperties,trashed)');
    const byAsset=new Map(remotes.filter(x=>x.appProperties?.lotkeysAssetId).map(x=>[x.appProperties.lotkeysAssetId,x]));
    const localIds=new Set(items.map(x=>x.id));
    for(let i=0;i<items.length;i++){
      const item=items[i]; const existing=(item.driveFileId&&remotes.find(x=>x.id===item.driveFileId))||byAsset.get(item.id);
      const prefix=kind==='photo'?String(i+1).padStart(2,'0')+' - ':'';
      const wanted=safeName(prefix+(item.name||(`${kind}-${i+1}`)),`${kind}-${i+1}`);
      if(existing){ item.driveFileId=existing.id; if(existing.name!==wanted) await patchMetadata(existing.id,{name:wanted}); continue; }
      if(!item.blob) continue;
      const f=await multipartCreate(item.blob,{name:wanted,parents:[folderId],appProperties:{lotkeysAssetId:item.id,lotkeysVehicleId:vehicleId,lotkeysAssetKind:kind}});
      item.driveFileId=f.id;
    }
    for(const r of remotes){
      const assetId=r.appProperties?.lotkeysAssetId;
      if(assetId && r.appProperties?.lotkeysVehicleId===vehicleId && !localIds.has(assetId)) await trashFile(r.id).catch(()=>{});
    }
    return items;
  }
  async function syncVehicle(v){
    if(!v?.id) throw new Error('Vehicle ID missing.');
    v.name=buildVehicleProfileName(v);
    const s=await structure(); const c=await config();
    v.drive=v.drive||{};
    let profile=null;
    if(v.drive.profileFolderId){ profile=await driveGet(v.drive.profileFolderId,'id,name,mimeType,webViewLink,appProperties').catch(()=>null); }
    if(!profile) profile=await findChildByAppProperty(s.inventoryId,'lotkeysVehicleId',v.id,FOLDER_MIME);
    if(!profile) profile=await createFolder(v.name||v.id,s.inventoryId,{lotkeysVehicleId:v.id,lotkeysRole:'vehicleProfile'});
    else if(profile.name!==(v.name||v.id)) profile=await patchMetadata(profile.id,{name:v.name||v.id});
    v.drive.profileFolderId=profile.id;
    const shared=await ensureFolder(profile.id,'Shared','lotkeysVehicleShared',v.id);
    const photos=await ensureFolder(shared.id,'Photos','lotkeysVehiclePhotos',v.id);
    const videos=await ensureFolder(shared.id,'Videos','lotkeysVehicleVideos',v.id);
    const docs=await ensureFolder(shared.id,'Documents','lotkeysVehicleDocuments',v.id);
    v.drive.sharedFolderId=shared.id;v.drive.photosFolderId=photos.id;v.drive.videosFolderId=videos.id;v.drive.documentsFolderId=docs.id;
    v.sharedFolderUrl=`https://drive.google.com/drive/folders/${shared.id}`;
    if(c.publicShareEnabled){
      try{await setAnyoneReader(shared.id);v.shareWarning='';}catch(e){v.shareWarning=e.message||'Public sharing could not be enabled';}
    }
    v.photos=await syncAssets(v.photos,photos.id,v.id,'photo');
    v.attachments=await syncAssets(v.attachments,docs.id,v.id,'document');
    v.videos=await syncAssets(v.videos,videos.id,v.id,'video');
    let sheet=null;
    if(v.drive.adminSheetId) sheet=await driveGet(v.drive.adminSheetId,'id,name,mimeType,webViewLink').catch(()=>null);
    if(!sheet) sheet=await createSpreadsheet(profile.id,v.id);
    v.drive.adminSheetId=sheet.id;v.drive.adminSheetUrl=sheet.webViewLink||`https://docs.google.com/spreadsheets/d/${sheet.id}/edit`;
    await writeVehicleSheet(sheet.id,v);
    v.syncStatus='synced';v.lastDriveSyncAt=Date.now();v.syncError='';
    await DB.put('vehicles',v);
    return v;
  }
  async function deleteVehicle(v){
    if(v?.drive?.profileFolderId) await trashFile(v.drive.profileFolderId);
  }
  async function syncListing(l){
    if(!l?.id) throw new Error('Listing ID missing.');
    const s=await structure(); const vehicle=l.vehicleId?await DB.get('vehicles',l.vehicleId):null;const loc=l.locationId?await DB.get('locations',l.locationId):null;
    const data={schemaVersion:2,listingId:l.id,userName:(await config()).userName,vehicleId:l.vehicleId||'',vehicleName:vehicle?.name||'',stock:vehicle?.stock||'',marketplaceTitle:l.marketplaceTitle||'',year:l.year||'',make:l.make||'',model:l.model||'',price:l.price??'',odometer:l.odometer??'',odometerUnit:l.odometerUnit||'',marketplaceDescription:l.description||'',location:loc?{id:loc.id,name:loc.name,address:loc.address,lat:loc.lat,lng:loc.lng}:null,status:l.status||'Draft',facebookUrl:l.facebookUrl||'',photoOrder:l.photoOrder||[],createdAt:l.createdAt||null,updatedAt:l.updatedAt||Date.now(),syncedAt:new Date().toISOString()};
    let fileId=l.driveFileId||'';
    if(!fileId){const f=await findChildByAppProperty(s.listingsId,'lotkeysListingId',l.id);fileId=f?.id||'';}
    const f=await upsertJson({fileId,name:`${safeName(l.marketplaceTitle||l.id,'listing')}.json`,parentId:s.listingsId,data,appProperties:{lotkeysListingId:l.id,lotkeysRole:'marketplaceListing'}});
    l.driveFileId=f.id;l.syncStatus='synced';l.lastDriveSyncAt=Date.now();l.syncError='';await DB.put('listings',l);return l;
  }
  async function deleteListing(l){ if(l?.driveFileId) await trashFile(l.driveFileId).catch(()=>{}); }
  async function chooseStoreFolder(){
    const c=await config();
    if(!c.apiKey) throw new Error('Google API Key is not configured in Settings.');
    if(!c.projectNumber) throw new Error('Google Cloud Project Number is not configured in Settings.');
    await authorize(false);await initPicker();
    return new Promise((resolve,reject)=>{
      const view=new google.picker.DocsView(google.picker.ViewId.FOLDERS).setSelectFolderEnabled(true);
      const picker=new google.picker.PickerBuilder().addView(view).setOAuthToken(accessToken).setDeveloperKey(c.apiKey).setAppId(c.projectNumber).setCallback(async data=>{
        const action=data[google.picker.Response.ACTION];
        if(action===google.picker.Action.CANCEL) return reject(new Error('Folder selection cancelled.'));
        if(action!==google.picker.Action.PICKED) return;
        try{
          const doc=data[google.picker.Response.DOCUMENTS][0];const id=doc[google.picker.Document.ID];
          const meta=await driveGet(id,'id,name,mimeType,webViewLink');
          if(meta.mimeType!==FOLDER_MIME) throw new Error('Please choose a folder.');
          await setSetting('storeFolderId',meta.id);await setSetting('storeFolderName',meta.name);await setSetting('storeFolderUrl',meta.webViewLink||`https://drive.google.com/drive/folders/${meta.id}`);await setSetting('driveStoreStructure',null);
          resolve(meta);
        }catch(e){reject(e)}
      }).build();
      picker.setVisible(true);
    });
  }
  async function useFolderUrl(url){
    const m=String(url||'').match(/\/folders\/([a-zA-Z0-9_-]+)/)||String(url||'').match(/[?&]id=([a-zA-Z0-9_-]+)/);if(!m)throw new Error('Could not find a Google Drive folder ID in that URL.');
    await authorize(false);const meta=await driveGet(m[1],'id,name,mimeType,webViewLink');if(meta.mimeType!==FOLDER_MIME)throw new Error('That Drive link is not a folder.');
    await setSetting('storeFolderId',meta.id);await setSetting('storeFolderName',meta.name);await setSetting('storeFolderUrl',meta.webViewLink||url);await setSetting('driveStoreStructure',null);return meta;
  }
  async function getStatus(){ const c=await config();const s=await setting('driveStoreStructure',null);return {isHttps:isHttps(),configured:!!c.clientId,hasPickerConfig:!!(c.apiKey&&c.projectNumber),connected:connected(),storeFolderId:c.storeFolderId,storeFolderName:c.storeFolderName,structure:s}; }
  return {authorize,disconnect,connected,ready,chooseStoreFolder,useFolderUrl,ensureStoreStructure,syncVehicle,deleteVehicle,syncListing,deleteListing,syncStoreConfig,getStatus,config};
})();
</script>

<script>
const App = (()=>{
  const $=s=>document.querySelector(s);
  const main=$('#main'), modal=$('#modal'), modalBody=$('#modal-body');
  let route='home', objectUrls=[];
  const uid=(p='ID')=>`${p}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}`;
  const money=n=>n!==''&&n!=null&&!Number.isNaN(+n)?new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD',maximumFractionDigits:0}).format(+n):'—';
  const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const fmtOdo=v=>v!==''&&v!=null?Number(v).toLocaleString('en-CA'):'—';
  const yyyyMmDd=d=>new Date(d).toISOString().slice(0,10);

  function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;setTimeout(()=>t.hidden=true,2400)}
  function cleanupUrls(){objectUrls.forEach(URL.revokeObjectURL);objectUrls=[]}
  function blobUrl(blob){if(!blob)return'';const u=URL.createObjectURL(blob);objectUrls.push(u);return u}
  async function setting(id,def=''){return (await DB.get('settings',id))?.value ?? def}
  async function setSetting(id,value){return DB.put('settings',{id,value})}
  function parseDriveFolderId(url){const s=(url||'').trim();const m=s.match(/\/folders\/([a-zA-Z0-9_-]+)/)||s.match(/[?&]id=([a-zA-Z0-9_-]+)/);return m?m[1]:''}
  function moveArrayItem(arr,from,to){const out=[...arr];const [item]=out.splice(from,1);out.splice(to,0,item);return out}
  function normalizePhotoOrder(listing,vehicle){if(!vehicle?.photos?.length)return[];const ids=vehicle.photos.map(p=>p.id);const raw=listing?.photoOrder||[];const normalized=raw.map(x=>typeof x==='number'?vehicle.photos[x]?.id:x).filter(x=>ids.includes(x));return normalized.length?normalized:ids}
  function updateProtocolNote(){const n=$('#local-test-note');if(!n)return;if(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'){n.className='protocol-warning protocol-good';n.innerHTML='<strong>LotKeys Drive Test · V0.3</strong> — hosted mode ready for Google Drive authorization.'}else{n.className='protocol-warning';n.innerHTML='<strong>LotKeys Drive Test · V0.3</strong> — interface works here, but Google sign-in will not. Open the hosted HTTPS version to test Drive sync.'}}
  async function syncVehicleNow(v,{quiet=false}={}){if(!(await DriveSync.ready())){v.syncStatus='local';await DB.put('vehicles',v);if(!quiet)toast('Saved locally — connect Drive to sync');return v;}v.syncStatus='syncing';await DB.put('vehicles',v);if(!quiet)toast('Saving to Google Drive…');try{const out=await DriveSync.syncVehicle(v);if(!quiet)toast('Vehicle synced to Drive ✓');return out}catch(err){v.syncStatus='error';v.syncError=err.message||String(err);await DB.put('vehicles',v);if(!quiet)alert('Vehicle saved locally, but Drive sync failed:\n\n'+v.syncError);return v}}
  async function syncListingNow(l,{quiet=false}={}){if(!(await DriveSync.ready())){l.syncStatus='local';await DB.put('listings',l);if(!quiet)toast('Listing saved locally — connect Drive to sync');return l;}l.syncStatus='syncing';await DB.put('listings',l);try{const out=await DriveSync.syncListing(l);if(!quiet)toast('Listing synced to your Drive folder ✓');return out}catch(err){l.syncStatus='error';l.syncError=err.message||String(err);await DB.put('listings',l);if(!quiet)alert('Listing saved locally, but Drive sync failed:\n\n'+l.syncError);return l}}
  async function copyText(text,label='Copied'){if(!text)return;try{await navigator.clipboard.writeText(text);toast(label)}catch{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast(label)}}
  function bindPhotoReorder(container,onMove){if(!container)return;let from=null,activeTile=null;container.querySelectorAll('.drag-handle').forEach(handle=>{handle.onpointerdown=e=>{const tile=handle.closest('.photo-tile');from=+tile.dataset.pos;activeTile=tile;tile.classList.add('dragging');handle.setPointerCapture?.(e.pointerId);e.preventDefault();e.stopPropagation()};handle.onpointermove=e=>{if(from===null)return;container.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));const under=document.elementFromPoint(e.clientX,e.clientY)?.closest('.photo-tile');if(under&&container.contains(under)&&under!==activeTile)under.classList.add('drop-target')};const finish=e=>{if(from===null)return;const under=document.elementFromPoint(e.clientX,e.clientY)?.closest('.photo-tile');const to=under&&container.contains(under)?+under.dataset.pos:from;container.querySelectorAll('.drop-target,.dragging').forEach(x=>x.classList.remove('drop-target','dragging'));const old=from;from=null;activeTile=null;if(Number.isFinite(to)&&to!==old)onMove(old,to)};handle.onpointerup=finish;handle.onpointercancel=()=>{container.querySelectorAll('.drop-target,.dragging').forEach(x=>x.classList.remove('drop-target','dragging'));from=null;activeTile=null}})}

  async function boot(){
    updateProtocolNote();
    await DB.open();
    await ensureDefaults();
    $('#quick-add').onclick=()=>showCreateChooser();
    document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>go(b.dataset.route));
    if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
    await render();
  }
  async function ensureDefaults(){
    if(!(await DB.get('locations','loc-south'))) await DB.put('locations',{id:'loc-south',name:'South Edmonton',address:'',lat:'',lng:'',createdAt:Date.now()});
    if(!(await DB.get('settings','retentionDays'))) await setSetting('retentionDays',120);
    if(!(await DB.get('settings','publicShareEnabled'))) await setSetting('publicShareEnabled',true);
    await pruneAnalytics();
  }
  async function pruneAnalytics(){
    const days=+(await setting('retentionDays',120)); const cutoff=Date.now()-days*86400000;
    const rows=await DB.all('analytics');
    await Promise.all(rows.filter(x=>new Date(x.date).getTime()<cutoff).map(x=>DB.del('analytics',x.id)));
  }
  async function go(r){route=r;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.route===r));await render()}
  async function render(){
    cleanupUrls();
    const store=await setting('storeName','LOTKEYS');$('#store-name').textContent=store||'LOTKEYS';
    const titles={home:'Home',vehicles:'Vehicles',listings:'My Listings',settings:'Settings'};$('#page-title').textContent=titles[route]||'LotKeys';
    if(route==='home')return renderHome();if(route==='vehicles')return renderVehicles();if(route==='listings')return renderListings();if(route==='settings')return renderSettings();
  }
  function empty(label,sub=''){return `<div class="card empty"><strong>${esc(label)}</strong>${sub?`<div class="small" style="margin-top:6px">${esc(sub)}</div>`:''}</div>`}
  async function renderHome(){
    const vehicles=await DB.all('vehicles'), listings=await DB.all('listings');
    const active=listings.filter(x=>x.status!=='Archived'&&x.status!=='Sold');
    main.innerHTML=`
      <section class="card hero"><strong>Find a vehicle fast</strong><p>Search partial stock #, VIN, year, make, model or profile name.</p><div style="margin-top:14px"><input id="global-search" class="search" placeholder="Try part of a STK#…" autocomplete="off"></div></section>
      <div id="search-results"></div>
      <div class="stats"><div class="stat"><strong>${vehicles.length}</strong><span>Store vehicles cached</span></div><div class="stat"><strong>${active.length}</strong><span>My active listings</span></div></div>
      <div class="section-title"><h2>Recent listings</h2><small>Personal</small></div>
      <div id="recent-listings">${active.length?'':empty('No Marketplace listings yet','Create one from a saved vehicle.')}</div>`;
    $('#global-search').oninput=e=>renderSearch(e.target.value,vehicles,$('#search-results'));
    const recent=active.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).slice(0,4);$('#recent-listings').innerHTML=recent.length?(await Promise.all(recent.map(listingCard))).join(''):empty('No Marketplace listings yet','Create one from a saved vehicle.');
    bindListingCards();
  }
  async function renderSearch(q,vehicles,target){q=q.trim().toLowerCase();if(!q){target.innerHTML='';return}const scored=vehicles.map(v=>{const vals=[v.stock,v.vin,v.name,v.year,v.make,v.model].map(x=>String(x||'').toLowerCase());let score=0;vals.forEach(x=>{if(x.startsWith(q))score+=5;else if(x.includes(q))score+=2});return{v,score}}).filter(x=>x.score).sort((a,b)=>b.score-a.score).slice(0,5);target.innerHTML=scored.length?`<div class="section-title"><h2>Best matches</h2><small>${scored.length} shown</small></div>${(await Promise.all(scored.map(x=>vehicleCard(x.v)))).join('')}`:empty('No matches');bindVehicleCards()}
  async function vehicleCard(v){const cover=v.photos?.[0]?.blob;const img=cover?`<img src="${blobUrl(cover)}" alt="">`:'🚙';return `<div class="card vehicle-row open-vehicle" data-id="${v.id}"><div class="thumb">${img}</div><div><div class="row-title">${esc(v.name||`${v.year||''} ${v.make||''} ${v.model||''}`.trim())}</div><div class="meta">STK# ${esc(v.stock||'—')} • ${fmtOdo(v.odometer)} ${esc(v.odometerUnit||'KM')}</div><div class="price">${money(v.price)}</div></div><div class="chev">›</div></div>`}
  function bindVehicleCards(){document.querySelectorAll('.open-vehicle').forEach(x=>x.onclick=()=>showVehicle(x.dataset.id))}
  async function renderVehicles(){const vs=(await DB.all('vehicles')).sort((a,b)=>String(a.stock||'').localeCompare(String(b.stock||'')));main.innerHTML=`<div class="actions"><button class="btn primary" id="add-vehicle">＋ Add Vehicle</button></div><div class="section-title"><h2>Shared store inventory</h2><small>${vs.length}</small></div>${vs.length?(await Promise.all(vs.map(vehicleCard))).join(''):empty('No vehicles yet','Add your first vehicle profile.')}`;$('#add-vehicle').onclick=()=>showVehicleForm();bindVehicleCards()}
  async function showVehicle(id){const v=await DB.get('vehicles',id);if(!v)return;
    const renderMasterPhotos=()=>{const wrap=$('#master-photo-area');if(!wrap)return;const photos=v.photos||[];wrap.innerHTML=photos.length?`<div class="help" style="margin-bottom:8px">Drag the ☰ handle onto another photo to reorder. Photo #1 is the vehicle thumbnail and default cover for new listings.</div><div class="photo-grid" id="master-photo-grid">${photos.map((p,i)=>`<div class="photo-tile" data-pos="${i}"><img draggable="false" src="${blobUrl(p.blob)}"><span class="badge">${i===0?'Cover':i+1}</span><button type="button" class="drag-handle" aria-label="Reorder photo">☰</button></div>`).join('')}</div>`:'';const grid=$('#master-photo-grid');bindPhotoReorder(grid,async(from,to)=>{v.photos=moveArrayItem(v.photos,from,to);v.updatedAt=Date.now();await DB.put('vehicles',v);cleanupUrls();renderMasterPhotos();toast('Photo order updated');syncVehicleNow(v,{quiet:true})})};
    modalBody.innerHTML=`<div class="modal-head"><div><div class="eyebrow">VEHICLE PROFILE</div><h2>${esc(v.name)}</h2></div><button class="close">×</button></div>
    <div id="master-photo-area"></div>

  function buildVehicleProfileName({stock='',year='',make='',model=''}={}){
    stock=String(stock||'').trim();year=String(year||'').trim();make=String(make||'').trim();model=String(model||'').trim();
    let vehicle='';
    if(model && make && model.toLowerCase().startsWith(make.toLowerCase()+' ')) vehicle=[year,model].filter(Boolean).join(' ');
    else vehicle=[year,make,model].filter(Boolean).join(' ');
    if(stock && vehicle) return `STK: ${stock} - ${vehicle}`;
    if(stock) return `STK: ${stock}`;
    return vehicle||'New Vehicle Profile';
  }

    <div class="card"><div class="section-title" style="margin-top:0"><h2>Local test backup</h2></div><div class="split"><button class="btn" id="export-json">Export JSON</button><label class="btn" style="text-align:center">Import JSON<input id="import-json" type="file" accept="application/json" hidden></label></div><div class="help">This local backup is for testing. Drive remains the shared store copy once sync is enabled.</div></div>`;
    $('#save-google').onclick=async()=>{await setSetting('googleClientId',$('#google-client').value.trim());await setSetting('googleApiKey',$('#google-key').value.trim());await setSetting('googleProjectNumber',$('#google-project-number').value.trim());toast('Google test credentials saved');render()};
    $('#drive-connect').onclick=async()=>{try{toast('Opening Google authorization…');await DriveSync.authorize(true);toast('Google Drive connected ✓');render()}catch(err){alert('Google Drive connection failed:\n\n'+err.message)}};
    if($('#drive-disconnect'))$('#drive-disconnect').onclick=async()=>{await DriveSync.disconnect();toast('Google session disconnected');render()};
    $('#pick-store').onclick=async()=>{try{const m=await DriveSync.chooseStoreFolder();toast(`Selected ${m.name}`);render()}catch(err){if(!/cancel/i.test(err.message))alert('Could not choose Store folder:\n\n'+err.message)}};
    $('#use-folder-url').onclick=async()=>{try{await setSetting('storeFolderUrl',$('#set-folder').value.trim());const m=await DriveSync.useFolderUrl($('#set-folder').value.trim());toast(`Selected ${m.name}`);render()}catch(err){alert('Could not use that folder URL:\n\n'+err.message+'\n\nTry Choose Store Folder instead.')}};
    $('#save-store').onclick=async()=>{await setSetting('storeName',$('#set-store').value.trim());await setSetting('userName',$('#set-user').value.trim());await setSetting('storeFolderUrl',$('#set-folder').value.trim());await setSetting('publicShareEnabled',$('#public-share').checked);toast('Store settings saved');if(await DriveSync.ready())DriveSync.syncStoreConfig().catch(()=>{});render()};
    $('#init-store').onclick=async()=>{await setSetting('storeName',$('#set-store').value.trim());await setSetting('userName',$('#set-user').value.trim());await setSetting('publicShareEnabled',$('#public-share').checked);try{toast('Building Store folders…');await DriveSync.ensureStoreStructure();toast('Store structure ready ✓');render()}catch(err){alert('Could not initialize Store structure:\n\n'+err.message)}};
    $('#add-loc').onclick=()=>showLocationForm();document.querySelectorAll('.edit-loc').forEach(b=>b.onclick=async()=>showLocationForm(await DB.get('locations',b.dataset.id)));document.querySelectorAll('.del-loc').forEach(b=>b.onclick=async()=>{if(confirm('Delete this saved location?')){await DB.del('locations',b.dataset.id);if(await DriveSync.ready())DriveSync.syncStoreConfig().catch(()=>{});render()}});$('#save-ret').onclick=async()=>{await setSetting('retentionDays',Math.max(7,+$('#ret-days').value||120));await pruneAnalytics();toast('Retention updated')};$('#export-json').onclick=exportJson;$('#import-json').onchange=importJson;
  }
  function showLocationForm(existing=null){const l=existing||{id:uid('LOC')};modalBody.innerHTML=`<div class="modal-head"><h2>${existing?'Edit':'Add'} Location</h2><button class="close">×</button></div><form id="loc-form"><div class="field"><label>Name</label><input name="name" required value="${esc(l.name||'')}" placeholder="e.g. Sherwood Park"></div><div class="field"><label>Address</label><input name="address" value="${esc(l.address||'')}" placeholder="Optional full address"></div><div class="form-grid"><div class="field"><label>Latitude</label><input name="lat" value="${esc(l.lat||'')}"></div><div class="field"><label>Longitude</label><input name="lng" value="${esc(l.lng||'')}"></div></div><button class="btn primary block">Save Location</button></form>`;modalBody.querySelector('.close').onclick=()=>modal.close();$('#loc-form').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);l.name=fd.get('name').trim();l.address=fd.get('address').trim();l.lat=fd.get('lat').trim();l.lng=fd.get('lng').trim();l.updatedAt=Date.now();l.createdAt=l.createdAt||Date.now();await DB.put('locations',l);if(await DriveSync.ready())DriveSync.syncStoreConfig().catch(()=>{});modal.close();toast('Location saved');render()};modal.showModal()}
  async function exportJson(){const data={version:1,exportedAt:new Date().toISOString(),vehicles:(await DB.all('vehicles')).map(stripBlobs),listings:await DB.all('listings'),locations:await DB.all('locations'),analytics:await DB.all('analytics'),settings:await DB.all('settings')};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=`lotkeys-backup-${yyyyMmDd(Date.now())}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
  function stripBlobs(v){const copy=structuredClone(v);['photos','attachments','videos'].forEach(k=>copy[k]=(copy[k]||[]).map(({blob,...rest})=>rest));return copy}
  async function importJson(e){const f=e.target.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text());for(const name of ['vehicles','listings','locations','analytics','settings'])if(Array.isArray(data[name]))for(const row of data[name])await DB.put(name,row);toast('Backup imported');render()}catch(err){alert('Could not import backup: '+err.message)}}
  return {boot};
})();
window.addEventListener('DOMContentLoaded',App.boot);

  </script>
</body>
</html>
