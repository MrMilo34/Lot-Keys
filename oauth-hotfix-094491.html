<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>LotKeys Google Setup Repair</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f3f4f6}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box}
    .card{width:min(430px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:24px;box-shadow:0 12px 40px rgba(17,24,39,.12);text-align:center}
    img{width:72px;height:72px;object-fit:contain;border-radius:16px}
    h1{font-size:24px;margin:14px 0 8px}p{color:#6b7280;line-height:1.5;margin:0}.status{margin-top:18px;font-weight:800;color:#2563eb}.error{color:#b91c1c}
  </style>
</head>
<body>
  <main class="card">
    <img src="./assets/lotkeys-default-logo.png" alt="LotKeys">
    <h1>Updating LotKeys</h1>
    <p>This one-time repair adds the official LotKeys Google sign-in configuration to this device.</p>
    <div class="status" id="status">Applying Google sign-in fix…</div>
  </main>
<script>
(() => {
  'use strict';
  const CLIENT_ID='61170708521-468omogqcjqfv4msjjl7pqihcjfocl5i.apps.googleusercontent.com';
  const DB_NAME='autolister-v1';
  const VERSION=1;
  const STORES=['vehicles','listings','locations','analytics','settings'];
  const status=document.getElementById('status');
  function fail(message){status.classList.add('error');status.textContent=message+' Close this page and try again.';}
  try{
    const req=indexedDB.open(DB_NAME,VERSION);
    req.onupgradeneeded=()=>{
      const db=req.result;
      STORES.forEach(name=>{if(!db.objectStoreNames.contains(name))db.createObjectStore(name,{keyPath:'id'});});
    };
    req.onerror=()=>fail('LotKeys storage could not be opened.');
    req.onsuccess=()=>{
      const db=req.result;
      try{
        const tx=db.transaction('settings','readwrite');
        tx.objectStore('settings').put({id:'googleClientId',value:CLIENT_ID});
        tx.oncomplete=()=>{
          status.textContent='Google sign-in repaired ✓ Opening LotKeys…';
          db.close();
          setTimeout(()=>location.replace('./?build=094491'),450);
        };
        tx.onerror=()=>fail('The Google sign-in setting could not be saved.');
      }catch(e){fail('The LotKeys settings area could not be updated.');}
    };
  }catch(e){fail('This browser could not access LotKeys storage.');}
})();
</script>
</body>
</html>
