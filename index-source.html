{width:100%;height:100%;object-fit:cover}.photo-tile .badge{position:absolute;top:5px;left:5px;background:rgba(17,24,39,.82);color:#fff;border-radius:999px;padding:3px 7px;font-size:10px}.photo-tile button{position:absolute;right:5px;top:5px;border:0;background:rgba(255,255,255,.9);width:25px;height:25px;border-radius:999px}.photo-tile .drag-handle{top:auto;bottom:5px;background:rgba(17,24,39,.82);color:white;font-size:13px;font-weight:900;touch-action:none;cursor:grab}.photo-tile .drag-handle:active{cursor:grabbing}.photo-tile.dragging{outline:3px solid #2563eb;transform:scale(.97)}.photo-tile.drop-target{outline:3px dashed #60a5fa}.share-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.btn[disabled]{opacity:.5;cursor:not-allowed}.empty{text-align:center;padding:28px 16px;color:var(--muted)}dialog{border:0;border-radius:20px;padding:0;width:min(720px,calc(100% - 22px));max-height:88vh;overflow:auto;box-shadow:0 30px 90px rgba(0,0,0,.28)}dialog::backdrop{background:rgba(17,24,39,.55)}#modal-body{padding:18px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modal-head h2{margin:0}.close{border:0;background:#f3f4f6;width:38px;height:38px;border-radius:12px;font-size:20px}.toast{position:fixed;z-index:30;left:50%;bottom:92px;transform:translateX(-50%);background:#111827;color:white;border-radius:12px;padding:11px 15px;font-size:13px;box-shadow:var(--shadow)}.detail-title{margin:2px 0 4px;font-size:24px}.detail-sub{color:var(--muted);margin-bottom:16px}.kv{display:grid;grid-template-columns:130px 1fr;gap:7px 12px;font-size:14px}.kv div:nth-child(odd){color:var(--muted)}.chart{width:100%;height:170px;background:#f9fafb;border:1px solid var(--line);border-radius:14px;margin-top:10px}.chart text{font-size:10px;fill:#6b7280}.chart polyline{fill:none;stroke:currentColor;stroke-width:3}.chart circle{fill:currentColor}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.notice{padding:12px;border-radius:12px;background:#eff6ff;color:#1e40af;font-size:13px}.warning{background:#fff7ed;color:#9a3412}.muted{color:var(--muted)}.small{font-size:12px}.codeish{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:#f9fafb;border:1px solid var(--line);padding:10px;border-radius:10px;overflow:auto}.hr{height:1px;background:var(--line);margin:16px 0}@media(max-width:520px){.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.vehicle-row,.listing-row{grid-template-columns:64px 1fr auto}.thumb{width:64px;height:52px}.stats{grid-template-columns:repeat(2,1fr)}}

<body>
  <div id="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow" id="store-name">AUTO LISTER</div>
        <h1 id="page-title">Home</h1>
      </div>
      <button class="icon-btn" id="quick-add" aria-label="Create">＋</button>
    </header>

    <div id="local-test-note" style="margin:0 16px 8px;padding:8px 10px;border-radius:10px;background:#fff7ed;color:#9a3412;font-size:12px;line-height:1.35"><strong>Phone Test Mode · V1.1</strong> — buttons should work directly from this file. Data persistence may be temporary until the hosted/Drive-connected version.</div>
    <main id="main"></main>

    <nav class="bottom-nav" aria-label="Primary">
      <button data-route="home" class="nav-btn active"><span>⌂</span><small>Home</small></button>
      <button data-route="vehicles" class="nav-btn"><span>🚙</span><small>Vehicles</small></button>
      <button data-route="listings" class="nav-btn"><span>📢</span><small>Listings</small></button>
      <button data-route="settings" class="nav-btn"><span>⚙</span><small>Settings</small></button>
    </nav>

  <script>
const DB = (() => {
  const DB_NAME = 'autolister-v1';
  const VERSION = 1;
  const STORES = ['vehicles','listings','locations','analytics','settings'];
  let db = null;
  let useMemory = false;
  const memory = Object.fromEntries(STORES.map(n => [n, new Map()]));

  function openIndexedDB(){
    return new Promise((resolve,reject)=>{
      try {
        if (!('indexedDB' in window)) return reject(new Error('IndexedDB unavailable'));
        if(db) return resolve(db);
        const req=indexedDB.open(DB_NAME,VERSION);
        req.onupgradeneeded=()=>{
          const d=req.result;
          STORES.forEach(name=>{
            if(!d.objectStoreNames.contains(name)){
              const s=d.createObjectStore(name,{keyPath:'id'});
              if(name==='analytics') s.createIndex('listingId','listingId',{unique:false});
              if(name==='listings') s.createIndex('vehicleId','vehicleId',{unique:false});
            }
          });
        };
        req.onsuccess=()=>{db=req.result;resolve(db)};
        req.onerror=()=>reject(req.error || new Error('IndexedDB failed'));
        req.onblocked=()=>reject(new Error('IndexedDB blocked'));
      } catch(err) { reject(err); }
    });
  }

  async function open(){
    if(useMemory) return null;
    try { return await openIndexedDB(); }
    catch(err){
      console.warn('AutoLister: IndexedDB unavailable in this local-file mode; using temporary in-memory storage.', err);
      useMemory=true;
      return null;
    }
  }

  async function store(name,mode='readonly'){
    const d=await open();
    if(useMemory) return null;
    return d.transaction(name,mode).objectStore(name);
  }

  async function all(name){
    await open();
    if(useMemory) return Array.from(memory[name].values());
    return new Promise(async(res,rej)=>{const r=(await store(name)).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  }
  async function get(name,id){
    await open();
    if(useMemory) return memory[name].get(id);
    return new Promise(async(res,rej)=>{const r=(await store(name)).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  }
  async function put(name,value){
    await open();
    if(useMemory){memory[name].set(value.id,value);return value;}
    return new Promise(async(res,rej)=>{const r=(await store(name,'readwrite')).put(value);r.onsuccess=()=>res(value);r.onerror=()=>rej(r.error)});
  }
  async function del(name,id){
    await open();
    if(useMemory){memory[name].delete(id);return;}
    return new Promise(async(res,rej)=>{const r=(await store(name,'readwrite')).delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)});
  }
  async function clear(name){
    await open();
    if(useMemory){memory[name].clear();return;}
    return new Promise(async(res,rej)=>{const r=(await store(name,'readwrite')).clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error)});
  }
  async function byIndex(name,index,key){
    await open();
    if(useMemory){
      return Array.from(memory[name].values()).filter(v=>v && v[index]===key);
    }
    return new Promise(async(res,rej)=>{const s=await store(name);const r=s.index(index).getAll(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  }
  function isTemporary(){ return useMemory; }
  return {open,all,get,put,del,clear,byIndex,isTemporary};
})();
  </script>
  <script>
const App = (()=>{
  const $=s=>document.querySelector(s);
  const main=$('#main'), modal=$('#modal'), modalBody=$('#modal-body');
  let route='home', objectUrls=[];
  const uid=(p='ID')=>`${p}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}`;
  const money=n=>n!==''&&n!=null&&!Number.isNaN(+n)?new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD',maximumFractionDigits:0}).format(+n):'—';
  const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const fmtOdo=v=>v!==''&&v!=null?Number(v).toLocaleString('en-CA'):'—';
  const yyyyMmDd=d=>new Date(d).toISOString().slice(0,10);

  function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;setTimeout(()=>t.hidden=true,2400)}
  function cleanupUrls(){objectUrls.forEach(URL.revokeObjectURL);objectUrls=[]}
  function blobUrl(blob){if(!blob)return'';const u=URL.createObjectURL(blob);objectUrls.push(u);return u}
  async function setting(id,def=''){return (await DB.get('settings',id))?.value ?? def}
  async function setSetting(id,value){return DB.put('settings',{id,value})}
  function parseDriveFolderId(url){const s=(url||'').trim();const m=s.match(/\/folders\/([a-zA-Z0-9_-]+)/)||s.match(/[?&]id=([a-zA-Z0-9_-]+)/);return m?m[1]:''}
  function moveArrayItem(arr,from,to){const out=[...arr];const [item]=out.splice(from,1);out.splice(to,0,item);return out}
  function normalizePhotoOrder(listing,vehicle){if(!vehicle?.photos?.length)return[];const ids=vehicle.photos.map(p=>p.id);const raw=listing?.photoOrder||[];const normalized=raw.map(x=>typeof x==='number'?vehicle.photos[x]?.id:x).filter(x=>ids.includes(x));return normalized.length?normalized:ids}
  async function copyText(text,label='Copied'){if(!text)return;try{await navigator.clipboard.writeText(text);toast(label)}catch{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast(label)}}
  function bindPhotoReorder(container,onMove){if(!container)return;let from=null,activeTile=null;container.querySelectorAll('.drag-handle').forEach(handle=>{handle.onpointerdown=e=>{const tile=handle.closest('.photo-tile');from=+tile.dataset.pos;activeTile=tile;tile.classList.add('dragging');handle.setPointerCapture?.(e.pointerId);e.preventDefault();e.stopPropagation()};handle.onpointermove=e=>{if(from===null)return;container.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));const under=document.elementFromPoint(e.clientX,e.clientY)?.closest('.photo-tile');if(under&&container.contains(under)&&under!==activeTile)under.classList.add('drop-target')};const finish=e=>{if(from===null)return;const under=document.elementFromPoint(e.clientX,e.clientY)?.closest('.photo-tile');const to=under&&container.contains(under)?+under.dataset.pos:from;container.querySelectorAll('.drop-target,.dragging').forEach(x=>x.classList.remove('drop-target','dragging'));const old=from;from=null;activeTile=null;if(Number.isFinite(to)&&to!==old)onMove(old,to)};handle.onpointerup=finish;handle.onpointercancel=()=>{container.querySelectorAll('.drop-target,.dragging').forEach(x=>x.classList.remove('drop-target','dragging'));from=null;activeTile=null}})}

  async function boot(){
    await DB.open();
    await ensureDefaults();
    $('#quick-add').onclick=()=>showCreateChooser();
    document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>go(b.dataset.route));
    if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
    await render();
  }
  async function ensureDefaults(){
    if(!(await DB.get('locations','loc-south'))) await DB.put('locations',{id:'loc-south',name:'South Edmonton',address:'',lat:'',lng:'',createdAt:Date.now()});
    if(!(await DB.get('settings','retentionDays'))) await setSetting('retentionDays',120);
    await pruneAnalytics();
  }
  async function pruneAnalytics(){
    const days=+(await setting('retentionDays',120)); const cutoff=Date.now()-days*86400000;
    const rows=await DB.all('analytics');
    await Promise.all(rows.filter(x=>new Date(x.date).getTime()<cutoff).map(x=>DB.del('analytics',x.id)));
  }
  async function go(r){route=r;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.route===r));await render()}
  async function render(){
    cleanupUrls();
    const store=await setting('storeName','AUTO LISTER');$('#store-name').textContent=store||'AUTO LISTER';
    const titles={home:'Home',vehicles:'Vehicles',listings:'My Listings',settings:'Settings'};$('#page-title').textContent=titles[route]||'AutoLister';
    if(route==='home')return renderHome();if(route==='vehicles')return renderVehicles();if(route==='listings')return renderListings();if(route==='settings')return renderSettings();
  }
  function empty(label,sub=''){return `<div class="card empty"><strong>${esc(label)}</strong>${sub?`<div class="small" style="margin-top:6px">${esc(sub)}</div>`:''}</div>`}
  async function renderHome(){
    const vehicles=await DB.all('vehicles'), listings=await DB.all('listings');
    const active=listings.filter(x=>x.status!=='Archived'&&x.status!=='Sold');
    main.innerHTML=`
      <section class="card hero"><strong>Find a vehicle fast</strong><p>Search partial stock #, VIN, year, make, model or profile name.</p><div style="margin-top:14px"><input id="global-search" class="search" placeholder="Try part of a STK#…" autocomplete="off"></div></section>
      <div id="search-results"></div>
      <div class="stats"><div class="stat"><strong>${vehicles.length}</strong><span>Store vehicles cached</span></div><div class="stat"><strong>${active.length}</strong><span>My active listings</span></div></div>
      <div class="section-title"><h2>Recent listings</h2><small>Personal</small></div>
      <div id="recent-listings">${active.length?'':empty('No Marketplace listings yet','Create one from a saved vehicle.')}</div>`;
    $('#global-search').oninput=e=>renderSearch(e.target.value,vehicles,$('#search-results'));
    const recent=active.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).slice(0,4);$('#recent-listings').innerHTML=recent.length?(await Promise.all(recent.map(listingCard))).join(''):empty('No Marketplace listings yet','Create one from a saved vehicle.');
    bindListingCards();
  }
  async function renderSearch(q,vehicles,target){q=q.trim().toLowerCase();if(!q){target.innerHTML='';return}const scored=vehicles.map(v=>{const vals=[v.stock,v.vin,v.name,v.year,v.make,v.model].map(x=>String(x||'').toLowerCase());let score=0;vals.forEach(x=>{if(x.startsWith(q))score+=5;else if(x.includes(q))score+=2});return{v,score}}).filter(x=>x.score).sort((a,b)=>b.score-a.score).slice(0,5);target.innerHTML=scored.length?`<div class="section-title"><h2>Best matches</h2><small>${scored.length} shown</small></div>${(await Promise.all(scored.map(x=>vehicleCard(x.v)))).join('')}`:empty('No matches');bindVehicleCards()}
  async function vehicleCard(v){const cover=v.photos?.[0]?.blob;const img=cover?`<img src="${blobUrl(cover)}" alt="">`:'🚙';return `<div class="card vehicle-row open-vehicle" data-id="${v.id}"><div class="thumb">${img}</div><div><div class="row-title">${esc(v.name||`${v.year||''} ${v.make||''} ${v.model||''}`.trim())}</div><div class="meta">STK# ${esc(v.stock||'—')} • ${fmtOdo(v.odometer)} ${esc(v.odometerUnit||'KM')}</div><div class="price">${money(v.price)}</div></div><div class="chev">›</div></div>`}
  function bindVehicleCards(){document.querySelectorAll('.open-vehicle').forEach(x=>x.onclick=()=>showVehicle(x.dataset.id))}
  async function renderVehicles(){const vs=(await DB.all('vehicles')).sort((a,b)=>String(a.stock||'').localeCompare(String(b.stock||'')));main.innerHTML=`<div class="actions"><button class="btn primary" id="add-vehicle">＋ Add Vehicle</button></div><div class="section-title"><h2>Shared store inventory</h2><small>${vs.length}</small></div>${vs.length?(await Promise.all(vs.map(vehicleCard))).join(''):empty('No vehicles yet','Add your first vehicle profile.')}`;$('#add-vehicle').onclick=()=>showVehicleForm();bindVehicleCards()}
  async function showVehicle(id){const v=await DB.get('vehicles',id);if(!v)return;
    const renderMasterPhotos=()=>{const wrap=$('#master-photo-area');if(!wrap)return;const photos=v.photos||[];wrap.innerHTML=photos.length?`<div class="help" style="margin-bottom:8px">Drag the ☰ handle onto another photo to reorder. Photo #1 is the vehicle thumbnail and default cover for new listings.</div><div class="photo-grid" id="master-photo-grid">${photos.map((p,i)=>`<div class="photo-tile" data-pos="${i}"><img draggable="false" src="${blobUrl(p.blob)}"><span class="badge">${i===0?'Cover':i+1}</span><button type="button" class="drag-handle" aria-label="Reorder photo">☰</button></div>`).join('')}</div>`:'';const grid=$('#master-photo-grid');bindPhotoReorder(grid,async(from,to)=>{v.photos=moveArrayItem(v.photos,from,to);v.updatedAt=Date.now();await DB.put('vehicles',v);cleanupUrls();renderMasterPhotos();toast('Photo order updated')})};
    modalBody.innerHTML=`<div class="modal-head"><div><div class="eyebrow">VEHICLE PROFILE</div><h2>${esc(v.name)}</h2></div><button class="close">×</button></div>
    <div id="master-photo-area"></div>
    <div class="hr"></div><div class="kv"><div>Stock #</div><strong>${esc(v.stock||'—')}</strong><div>VIN</div><span>${esc(v.vin||'—')}</span><div>Vehicle</div><span>${esc([v.year,v.make,v.model].filter(Boolean).join(' '))}</span><div>Price</div><span>${money(v.price)}</span><div>Odometer</div><span>${fmtOdo(v.odometer)} ${esc(v.odometerUnit||'KM')}</span><div>Shared folder</div><span>${v.sharedFolderUrl?'Connected':'Created automatically with Drive sync'}</span></div>
    <div class="share-actions">${v.sharedFolderUrl?`<button class="btn primary" id="copy-share">Copy Shared Link</button><button class="btn ghost" id="open-share">Open Shared Folder</button>`:`<button class="btn" disabled>Shared Link available after Drive sync</button>`}</div>
    <div class="section-title"><h2>Vehicle profile description</h2></div><div class="card" style="box-shadow:none">${esc(v.description||'No description yet.').replace(/\n/g,'<br>')}</div>
    <div class="actions"><button class="btn primary" id="create-from">Create Listing</button><button class="btn" id="edit-v">Edit Vehicle</button><button class="btn danger" id="delete-v">Delete</button></div>`;
    renderMasterPhotos();
    modalBody.querySelector('.close').onclick=()=>modal.close();$('#create-from').onclick=()=>{modal.close();showListingForm({vehicleId:id})};$('#edit-v').onclick=()=>showVehicleForm(v);
    if(v.sharedFolderUrl){$('#copy-share').onclick=()=>copyText(v.sharedFolderUrl,'Shared folder link copied');$('#open-share').onclick=()=>window.open(v.sharedFolderUrl,'_blank')}
    $('#delete-v').onclick=async()=>{if(confirm(`Delete ${v.name}? This removes its local profile and listings linked to it in this prototype.`)){const ls=await DB.byIndex('listings','vehicleId',id);for(const l of ls)await deleteListingCascade(l.id);await DB.del('vehicles',id);modal.close();toast('Vehicle deleted');render()}};modal.showModal();
  }
  function photoPreviewHtml(photos){return photos?.length?`<div class="help" style="margin-bottom:8px">Drag the ☰ handle to change the master order. #1 becomes the thumbnail.</div><div class="photo-grid reorder-master-form">${photos.map((p,i)=>`<div class="photo-tile" data-pos="${i}"><img draggable="false" src="${blobUrl(p.blob)}"><span class="badge">${i===0?'Cover':i+1}</span><button type="button" class="remove-photo" data-i="${i}">×</button><button type="button" class="drag-handle" aria-label="Reorder photo">☰</button></div>`).join('')}</div>`:'<div class="notice">No photos selected yet.</div>'}
  async function showVehicleForm(existing=null){
    const v=existing?structuredClone(existing):{id:uid('VP'),photos:[],attachments:[],videos:[],odometerUnit:'KM'}; if(existing?.photos)v.photos=existing.photos;
    modalBody.innerHTML=`<div class="modal-head"><h2>${existing?'Edit':'Add'} Vehicle</h2><button class="close">×</button></div><form id="vehicle-form"><div class="form-grid">
      <div class="field full"><label>Profile Name</label><input name="name" required value="${esc(v.name||'')}" placeholder="e.g. 2024 Infiniti QX60 Luxe"></div>
      <div class="field"><label>Year</label><input name="year" inputmode="numeric" value="${esc(v.year||'')}"></div><div class="field"><label>Make</label><input name="make" value="${esc(v.make||'')}"></div>
      <div class="field"><label>Model</label><input name="model" value="${esc(v.model||'')}"></div><div class="field"><label>Price</label><input name="price" inputmode="decimal" value="${esc(v.price||'')}"></div>
      <div class="field"><label>Odometer</label><input name="odometer" inputmode="numeric" value="${esc(v.odometer||'')}"></div><div class="field"><label>Unit</label><select name="odometerUnit"><option ${v.odometerUnit==='KM'?'selected':''}>KM</option><option ${v.odometerUnit==='MI'?'selected':''}>MI</option></select></div>
      <div class="field"><label>VIN #</label><input name="vin" value="${esc(v.vin||'')}"></div><div class="field"><label>STK #</label><input name="stock" value="${esc(v.stock||'')}"></div>
      <div class="field full"><label>Vehicle Profile Description</label><textarea name="description" placeholder="Store/customer-facing vehicle information. This is separate from Marketplace copy.">${esc(v.description||'')}</textarea></div>
      <div class="field full"><div class="notice"><strong>Shared folder:</strong> AutoLister will create this automatically inside the Vehicle Profile when Google Drive sync is connected. No link needs to be entered manually.</div></div>
      <div class="field full"><label>Photos</label><input id="vehicle-photos" type="file" accept="image/*" multiple><div class="help">On Android you can choose gallery images; camera capture will be added as a dedicated flow.</div><div id="photo-preview" style="margin-top:10px">${photoPreviewHtml(v.photos)}</div></div>
      <div class="field full"><label>Attachments</label><input id="vehicle-attachments" type="file" multiple><div class="help">Inspection sheets, PDFs and other vehicle files. Stored locally in this prototype.</div></div>
      <div class="field full"><label>Videos</label><input id="vehicle-videos" type="file" accept="video/*" multiple></div>
    </div><button class="btn primary block" type="submit">Save Vehicle</button></form>`;
    modalBody.querySelector('.close').onclick=()=>modal.close();
    const rerenderPhotos=()=>{const p=$('#photo-preview');p.innerHTML=photoPreviewHtml(v.photos);p.querySelectorAll('.remove-photo').forEach(b=>b.onclick=()=>{v.photos.splice(+b.dataset.i,1);rerenderPhotos()});bindPhotoReorder(p.querySelector('.reorder-master-form'),(from,to)=>{v.photos=moveArrayItem(v.photos,from,to);cleanupUrls();rerenderPhotos()})};
    $('#vehicle-photos').onchange=e=>{[...e.target.files].forEach(f=>v.photos.push({id:uid('PH'),name:f.name,type:f.type,blob:f}));rerenderPhotos()};
    $('#vehicle-attachments').onchange=e=>{v.attachments=[...e.target.files].map(f=>({id:uid('ATT'),name:f.name,type:f.type,blob:f}))};
    $('#vehicle-videos').onchange=e=>{v.videos=[...e.target.files].map(f=>({id:uid('VID'),name:f.name,type:f.type,blob:f}))};
    $('#vehicle-form').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);['name','year','make','model','vin','stock','description','odometerUnit'].forEach(k=>v[k]=fd.get(k)?.trim?.()??fd.get(k));v.price=fd.get('price')?+fd.get('price'):'';v.odometer=fd.get('odometer')?+fd.get('odometer'):'';v.updatedAt=Date.now();v.createdAt=v.createdAt||Date.now();await DB.put('vehicles',v);modal.close();toast('Vehicle saved');render()};modal.showModal();
  }
  async function listingCard(l){const v=l.vehicleId?await DB.get('vehicles',l.vehicleId):null;const order=normalizePhotoOrder(l,v);const coverId=order[0];const cover=v?.photos?.find(p=>p.id===coverId)?.blob||v?.photos?.[0]?.blob;const img=cover?`<img src="${blobUrl(cover)}">`:'📢';const loc=l.locationId?await DB.get('locations',l.locationId):null;return `<div class="card listing-row open-listing" data-id="${l.id}"><div class="thumb">${img}</div><div><div class="row-title">${esc(l.marketplaceTitle||'Untitled listing')}</div><div class="meta">${esc(loc?.name||'No location')} • ${esc(l.status||'Draft')} • ${l.createdAt?Math.max(0,Math.floor((Date.now()-l.createdAt)/86400000))+' days':'—'}</div><div class="price">${money(l.price)}</div></div><div class="chev">›</div></div>`}
  function bindListingCards(){document.querySelectorAll('.open-listing').forEach(x=>x.onclick=()=>showListing(x.dataset.id))}
  async function renderListings(){const ls=(await DB.all('listings')).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));main.innerHTML=`<div class="actions"><button class="btn primary" id="add-listing">＋ Create Listing</button></div><div class="section-title"><h2>My Marketplace listings</h2><small>${ls.length}</small></div>${ls.length?(await Promise.all(ls.map(listingCard))).join(''):empty('No listings yet','Create one from a vehicle profile or manually.')}`;$('#add-listing').onclick=()=>showListingForm({});bindListingCards()}
  async function analyticsFor(id){return (await DB.byIndex('analytics','listingId',id)).sort((a,b)=>new Date(a.date)-new Date(b.date))}
  function chartSvg(rows){if(!rows.length)return'<div class="notice">No view snapshots recorded yet.</div>';const vals=rows.map(r=>+r.views||0),w=560,h=150,p=18,min=Math.min(...vals),max=Math.max(...vals,1),span=Math.max(1,max-min),pts=vals.map((v,i)=>`${p+(i*(w-2*p)/Math.max(1,vals.length-1))},${h-p-((v-min)/span)*(h-2*p)}`).join(' ');return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img"><polyline points="${pts}"></polyline>${vals.map((v,i)=>{const x=p+(i*(w-2*p)/Math.max(1,vals.length-1)),y=h-p-((v-min)/span)*(h-2*p);return `<circle cx="${x}" cy="${y}" r="4"></circle>`}).join('')}<text x="18" y="16">${max} cumulative views</text><text x="18" y="142">${esc(rows[0].date)}</text><text x="470" y="142">${esc(rows.at(-1).date)}</text></svg>`}
  async function showListing(id){const l=await DB.get('listings',id);if(!l)return;const v=l.vehicleId?await DB.get('vehicles',l.vehicleId):null,loc=l.locationId?await DB.get('locations',l.locationId):null,rows=await analyticsFor(id);modalBody.innerHTML=`<div class="modal-head"><div><div class="eyebrow">MARKETPLACE LISTING</div><h2>${esc(l.marketplaceTitle)}</h2></div><button class="close">×</button></div><div class="kv"><div>Vehicle</div><span>${esc(v?.name||[l.year,l.make,l.model].filter(Boolean).join(' '))}</span><div>Location</div><span>${esc(loc?.name||'—')}</span><div>Status</div><span>${esc(l.status||'Draft')}</span><div>Created</div><span>${l.createdAt?new Date(l.createdAt).toLocaleDateString('en-CA'):'—'}</span><div>Facebook URL</div><span>${l.facebookUrl?`<a href="${esc(l.facebookUrl)}" target="_blank">Open listing</a>`:'Not saved'}</span></div><div class="section-title"><h2>Marketplace description</h2></div><div class="card" style="box-shadow:none">${esc(l.description||'').replace(/\n/g,'<br>')}</div><div class="section-title"><h2>Views</h2><small>rolling history</small></div>${chartSvg(rows)}<div class="actions"><button class="btn primary" id="add-snapshot">Add View Snapshot</button><button class="btn" id="dup-listing">Duplicate</button><button class="btn" id="edit-l">Edit</button><button class="btn danger" id="delete-l">Delete</button></div>`;modalBody.querySelector('.close').onclick=()=>modal.close();$('#edit-l').onclick=()=>showListingForm(l);$('#dup-listing').onclick=()=>{modal.close();showListingForm({...l,id:null,facebookUrl:'',status:'Draft',createdAt:null,updatedAt:null})};$('#add-snapshot').onclick=async()=>{const views=prompt('Current cumulative Marketplace views:');if(views==null||views==='')return;await DB.put('analytics',{id:uid('AN'),listingId:id,date:yyyyMmDd(Date.now()),views:+views});toast('Snapshot saved');showListing(id)};$('#delete-l').onclick=async()=>{if(confirm('Delete this listing record?')){await deleteListingCascade(id);modal.close();toast('Listing deleted');render()}};modal.showModal()}
  async function deleteListingCascade(id){for(const r of await DB.byIndex('analytics','listingId',id))await DB.del('analytics',r.id);await DB.del('listings',id)}
  async function showListingForm(input={}){
    const vehicles=await DB.all('vehicles'),locations=await DB.all('locations');let l=input.id?structuredClone(input):{...input,id:uid('LST'),status:'Draft'};let v=l.vehicleId?await DB.get('vehicles',l.vehicleId):null;
    const vehicleOptions=`<option value="">Create manually</option>${vehicles.map(x=>`<option value="${x.id}" ${x.id===l.vehicleId?'selected':''}>${esc(x.stock?x.stock+' — ':'')}${esc(x.name)}</option>`).join('')}`;
    const locationOptions=`<option value="">Choose location…</option>${locations.map(x=>`<option value="${x.id}" ${x.id===l.locationId?'selected':''}>${esc(x.name)}</option>`).join('')}`;
    function defaultsFromVehicle(){if(!v)return; l.year=v.year;l.make=v.make;l.model=v.model;l.price=v.price;l.odometer=v.odometer;l.odometerUnit=v.odometerUnit;l.photoOrder=(v.photos||[]).map(p=>p.id)}
    if(v&&!l.year)defaultsFromVehicle();
    modalBody.innerHTML=`<div class="modal-head"><h2>${input.id?'Edit':'Create'} Listing</h2><button class="close">×</button></div><form id="listing-form"><div class="field"><label>Vehicle Profile</label><select id="listing-vehicle" name="vehicleId">${vehicleOptions}</select><div class="help">Vehicle facts and photos can be pulled from the shared profile. Marketplace title and description remain separate.</div></div><div class="field"><label>Marketplace Title *</label><input name="marketplaceTitle" required value="${esc(l.marketplaceTitle||'')}"></div><div class="form-grid"><div class="field"><label>Year</label><input name="year" value="${esc(l.year||'')}"></div><div class="field"><label>Make</label><input name="make" value="${esc(l.make||'')}"></div><div class="field"><label>Model</label><input name="model" value="${esc(l.model||'')}"></div><div class="field"><label>Price</label><input name="price" inputmode="decimal" value="${esc(l.price||'')}"></div><div class="field"><label>Odometer</label><input name="odometer" inputmode="numeric" value="${esc(l.odometer||'')}"></div><div class="field"><label>Unit</label><select name="odometerUnit"><option ${l.odometerUnit==='KM'?'selected':''}>KM</option><option ${l.odometerUnit==='MI'?'selected':''}>MI</option></select></div></div><div class="field"><label>Listing Location</label><select name="locationId">${locationOptions}</select></div><div class="field"><label>Marketplace Description</label><textarea name="description" placeholder="Your Facebook Marketplace copy — intentionally separate from the Vehicle Profile description.">${esc(l.description||'')}</textarea></div><div class="field"><label>Status</label><select name="status">${['Draft','Active','Pending','Sold','Archived'].map(x=>`<option ${x===l.status?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Facebook Listing URL</label><input name="facebookUrl" value="${esc(l.facebookUrl||'')}" placeholder="Paste after posting"></div><div id="listing-photos"></div><button class="btn primary block" type="submit">Save Listing</button></form>`;
    modalBody.querySelector('.close').onclick=()=>modal.close();
    async function photoArea(){const el=$('#listing-photos');if(!v?.photos?.length){el.innerHTML='<div class="notice">No master vehicle photos available.</div>';return}l.photoOrder=normalizePhotoOrder(l,v);const order=l.photoOrder;el.innerHTML=`<div class="field"><label>Listing Photo Order</label><div class="help">This order belongs only to this Marketplace listing. Drag ☰ to reorder; changing it does not alter the Vehicle Profile photo order.</div><div class="photo-grid" id="listing-photo-grid">${order.map((photoId,pos)=>{const p=v.photos.find(x=>x.id===photoId);return p?`<div class="photo-tile" data-pos="${pos}"><img draggable="false" src="${blobUrl(p.blob)}"><span class="badge">${pos===0?'Cover':pos+1}</span><button type="button" class="drag-handle" aria-label="Reorder listing photo">☰</button></div>`:''}).join('')}</div></div>`;bindPhotoReorder($('#listing-photo-grid'),(from,to)=>{l.photoOrder=moveArrayItem(l.photoOrder,from,to);cleanupUrls();photoArea()})}
    await photoArea();
    $('#listing-vehicle').onchange=async e=>{l.vehicleId=e.target.value;v=l.vehicleId?await DB.get('vehicles',l.vehicleId):null;if(v){defaultsFromVehicle();const f=$('#listing-form');f.year.value=v.year||'';f.make.value=v.make||'';f.model.value=v.model||'';f.price.value=v.price||'';f.odometer.value=v.odometer||'';f.odometerUnit.value=v.odometerUnit||'KM'}else l.photoOrder=[];await photoArea()};
    $('#listing-form').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);['vehicleId','marketplaceTitle','year','make','model','odometerUnit','locationId','description','status','facebookUrl'].forEach(k=>l[k]=fd.get(k)?.trim?.()??fd.get(k));l.price=fd.get('price')?+fd.get('price'):'';l.odometer=fd.get('odometer')?+fd.get('odometer'):'';l.createdAt=l.createdAt||Date.now();l.updatedAt=Date.now();await DB.put('listings',l);modal.close();toast('Listing saved');go('listings')};modal.showModal();
  }
  async function showCreateChooser(){modalBody.innerHTML=`<div class="modal-head"><h2>Create</h2><button class="close">×</button></div><div class="actions" style="display:grid"><button class="btn primary" id="c-listing">📢 Marketplace Listing</button><button class="btn" id="c-vehicle">🚙 Vehicle Profile</button></div>`;modalBody.querySelector('.close').onclick=()=>modal.close();$('#c-listing').onclick=()=>{modal.close();showListingForm({})};$('#c-vehicle').onclick=()=>showVehicleForm();modal.showModal()}
  async function renderSettings(){const locs=await DB.all('locations'),storeName=await setting('storeName',''),userName=await setting('userName',''),folderUrl=await setting('storeFolderUrl',''),ret=await setting('retentionDays',120);const folderId=parseDriveFolderId(folderUrl);main.innerHTML=`<div class="card"><div class="section-title" style="margin-top:0"><h2>Store connection</h2></div><div class="field"><label>Store Name</label><input id="set-store" value="${esc(storeName)}" placeholder="e.g. Infiniti South Edmonton"></div><div class="field"><label>My User Name</label><input id="set-user" value="${esc(userName)}" placeholder="e.g. Blair"><div class="help">This becomes the user folder name under Store / Users.</div></div><div class="field"><label>Store Folder URL</label><input id="set-folder" value="${esc(folderUrl)}" placeholder="https://drive.google.com/drive/folders/…"><div class="help">Parsed folder ID: ${esc(folderId||'not set')}</div></div><button class="btn primary" id="save-store">Save</button><div class="notice" style="margin-top:12px"><strong>Prototype mode:</strong> the UI/data model works locally now. Live Google Drive folder creation/sync needs a Google Cloud OAuth Client ID + Drive API configuration.</div></div>
    <div class="card"><div class="section-title" style="margin-top:0"><h2>Planned store structure</h2></div><div class="codeish">STORE FOLDER<br>├── Users<br>│&nbsp;&nbsp;└── ${esc(userName||'Your Name')}<br>│&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;└── Listings<br>├── Administration<br>│&nbsp;&nbsp;├── Master Index<br>│&nbsp;&nbsp;└── Reporting / reference data<br>└── Inventory<br>&nbsp;&nbsp;&nbsp;└── Vehicle Profile<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;├── Administrative Sheet<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;└── Shared<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;├── Photos<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;├── Videos<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;└── Documents</div><div class="help">The Shared folder is customer-facing. Everything else can use store-controlled permissions.</div></div>
    <div class="card"><div class="section-title" style="margin-top:0"><h2>Saved posting locations</h2><small>${locs.length}</small></div><div id="loc-list">${locs.map(x=>`<div class="card" style="box-shadow:none"><strong>${esc(x.name)}</strong><div class="small muted">${esc(x.address||[x.lat,x.lng].filter(Boolean).join(', ')||'No pin details yet')}</div><div class="actions"><button class="btn ghost edit-loc" data-id="${x.id}">Edit</button><button class="btn danger del-loc" data-id="${x.id}">Delete</button></div></div>`).join('')}</div><button class="btn" id="add-loc">＋ Add Location</button></div>
    <div class="card"><div class="section-title" style="margin-top:0"><h2>Analytics retention</h2></div><div class="field"><label>Rolling history (days)</label><input id="ret-days" type="number" min="7" max="365" value="${esc(ret)}"></div><button class="btn" id="save-ret">Save & prune</button></div>
    <div class="card"><div class="section-title" style="margin-top:0"><h2>Prototype backup</h2></div><div class="split"><button class="btn" id="export-json">Export JSON</button><label class="btn" style="text-align:center">Import JSON<input id="import-json" type="file" accept="application/json" hidden></label></div><div class="help">Photos/files are not included in this lightweight JSON backup yet.</div></div>`;
    $('#save-store').onclick=async()=>{await setSetting('storeName',$('#set-store').value.trim());await setSetting('userName',$('#set-user').value.trim());await setSetting('storeFolderUrl',$('#set-folder').value.trim());toast('Store settings saved');render()};$('#add-loc').onclick=()=>showLocationForm();document.querySelectorAll('.edit-loc').forEach(b=>b.onclick=async()=>showLocationForm(await DB.get('locations',b.dataset.id)));document.querySelectorAll('.del-loc').forEach(b=>b.onclick=async()=>{if(confirm('Delete this saved location?')){await DB.del('locations',b.dataset.id);render()}});$('#save-ret').onclick=async()=>{await setSetting('retentionDays',Math.max(7,+$('#ret-days').value||120));await pruneAnalytics();toast('Retention updated')};$('#export-json').onclick=exportJson;$('#import-json').onchange=importJson;
  }
  function showLocationForm(existing=null){const l=existing||{id:uid('LOC')};modalBody.innerHTML=`<div class="modal-head"><h2>${existing?'Edit':'Add'} Location</h2><button class="close">×</button></div><form id="loc-form"><div class="field"><label>Name</label><input name="name" required value="${esc(l.name||'')}" placeholder="e.g. Sherwood Park"></div><div class="field"><label>Address</label><input name="address" value="${esc(l.address||'')}" placeholder="Optional full address"></div><div class="form-grid"><div class="field"><label>Latitude</label><input name="lat" value="${esc(l.lat||'')}"></div><div class="field"><label>Longitude</label><input name="lng" value="${esc(l.lng||'')}"></div></div><button class="btn primary block">Save Location</button></form>`;modalBody.querySelector('.close').onclick=()=>modal.close();$('#loc-form').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);l.name=fd.get('name').trim();l.address=fd.get('address').trim();l.lat=fd.get('lat').trim();l.lng=fd.get('lng').trim();l.updatedAt=Date.now();l.createdAt=l.createdAt||Date.now();await DB.put('locations',l);modal.close();toast('Location saved');render()};modal.showModal()}
  async function exportJson(){const data={version:1,exportedAt:new Date().toISOString(),vehicles:(await DB.all('vehicles')).map(stripBlobs),listings:await DB.all('listings'),locations:await DB.all('locations'),analytics:await DB.all('analytics'),settings:await DB.all('settings')};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=`autolister-backup-${yyyyMmDd(Date.now())}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
  function stripBlobs(v){const copy=structuredClone(v);['photos','attachments','videos'].forEach(k=>copy[k]=(copy[k]||[]).map(({blob,...rest})=>rest));return copy}
  async function importJson(e){const f=e.target.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text());for(const name of ['vehicles','listings','locations','analytics','settings'])if(Array.isArray(data[name]))for(const row of data[name])await DB.put(name,row);toast('Backup imported');render()}catch(err){alert('Could not import backup: '+err.message)}}
  return {boot};
})();
window.addEventListener('DOMContentLoaded',App.boot);
