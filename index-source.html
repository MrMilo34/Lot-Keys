  <script>
const DB = (() => {
  const DB_NAME = 'autolister-v1';
  const VERSION = 1;
  const STORES = ['vehicles','listings','locations','analytics','settings'];
  let db = null;
  let useMemory = false;
  const memory = Object.fromEntries(STORES.map(n => [n, new Map()]));

  function openIndexedDB(){
    return new Promise((resolve,reject)=>{
      try {
        if (!('indexedDB' in window)) return reject(new Error('IndexedDB unavailable'));
        if(db) return resolve(db);
        const req=indexedDB.open(DB_NAME,VERSION);
        req.onupgradeneeded=()=>{
          const d=req.result;
          STORES.forEach(name=>{
            if(!d.objectStoreNames.contains(name)){
              const s=d.createObjectStore(name,{keyPath:'id'});
              if(name==='analytics') s.createIndex('listingId','listingId',{unique:false});
              if(name==='listings') s.createIndex('vehicleId','vehicleId',{unique:false});
            }
          });
        };
        req.onsuccess=()=>{db=req.result;resolve(db)};
        req.onerror=()=>reject(req.error || new Error('IndexedDB failed'));
        req.onblocked=()=>reject(new Error('IndexedDB blocked'));
      } catch(err) { reject(err); }
    });
  }

  async function open(){
    if(useMemory) return null;
    try { return await openIndexedDB(); }
    catch(err){
      console.warn('LotKeys: IndexedDB unavailable in this local-file mode; using temporary in-memory storage.', err);
      useMemory=true;
      return null;
    }
  }

  async function store(name,mode='readonly'){
    const d=await open();
    if(useMemory) return null;
    return d.transaction(name,mode).objectStore(name);
  }

  async function all(name){
    await open();
    if(useMemory) return Array.from(memory[name].values());
    return new Promise(async(res,rej)=>{const r=(await store(name)).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  }
  async function get(name,id){
    await open();
    if(useMemory) return memory[name].get(id);
    return new Promise(async(res,rej)=>{const r=(await store(name)).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  }
  async function put(name,value){
    await open();
    if(useMemory){memory[name].set(value.id,value);return value;}
    return new Promise(async(res,rej)=>{const r=(await store(name,'readwrite')).put(value);r.onsuccess=()=>res(value);r.onerror=()=>rej(r.error)});
  }
  async function del(name,id){
    await open();
    if(useMemory){memory[name].delete(id);return;}
    return new Promise(async(res,rej)=>{const r=(await store(name,'readwrite')).delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)});
  }
  async function clear(name){
    await open();
    if(useMemory){memory[name].clear();return;}
    return new Promise(async(res,rej)=>{const r=(await store(name,'readwrite')).clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error)});
  }
  async function byIndex(name,index,key){
    await open();
    if(useMemory){
      return Array.from(memory[name].values()).filter(v=>v && v[index]===key);
    }
    return new Promise(async(res,rej)=>{const s=await store(name);const r=s.index(index).getAll(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  }
  function isTemporary(){ return useMemory; }
  return {open,all,get,put,del,clear,byIndex,isTemporary};
})();

<script>
// Shared helper used by both the UI and Google Drive sync.
function buildVehicleProfileName({stock='',year='',make='',model=''}={}){
  stock=String(stock||'').trim();year=String(year||'').trim();make=String(make||'').trim();model=String(model||'').trim();
  let vehicle='';
  if(model && make && model.toLowerCase().startsWith(make.toLowerCase()+' ')) vehicle=[year,model].filter(Boolean).join(' ');
  else vehicle=[year,make,model].filter(Boolean).join(' ');
  if(stock && vehicle) return `${vehicle} - ${stock}`;
  if(stock) return stock;
  return vehicle||'New Vehicle Profile';
}

// Shared user/account normalizers are intentionally global because DriveSync and the UI
// live in separate closures. v0.8.9 accidentally left these helpers only inside App,
// which caused Store refresh to stop at `normalizeStoreUsers is not defined`.

function lotKeysDefaultModerationStats(overrides={}){return {submitted:0,approved:0,dismissed:0,falseReports:0,...(overrides||{})}}
function lotKeysNormalizedAdminLevel(user={}){const raw=user.adminLevel!=null?Number(user.adminLevel):(user.role==='admin'?2:0);return Math.max(0,Math.min(2,Number.isFinite(raw)?raw:0))}
function normalizeUserAccount(user={}){const permissions=lotKeysDefaultUserPermissions(user.permissions||{}),moderation=lotKeysDefaultModerationStats(user.moderation||{}),contributions={points:Number(user?.contributions?.points)||0,awards:Array.isArray(user?.contributions?.awards)?user.contributions.awards:[]},adminLevel=lotKeysNormalizedAdminLevel(user);return {...user,adminLevel,role:adminLevel>0?'admin':'user',status:user.status||'active',permissions,moderation,contributions}}
function normalizeStoreUsers(users=[]){const seen=new Set(),out=[];for(const raw of Array.isArray(users)?users:[]){const u=normalizeUserAccount(raw||{}),key=lotKeysUserKey(u);if(key&&seen.has(key))continue;if(key)seen.add(key);out.push(u)}return out}
function normalizeRevealSettings(raw={}){
  raw=raw&&typeof raw==='object'?raw:{};
  let build=Number(raw.buildUpSeconds);if(!Number.isFinite(build)||build<=0)build=15;build=Math.max(1,Math.min(60,Math.round(build*100)/100));
  const hasFp=Object.prototype.hasOwnProperty.call(raw,'finalPushAtSeconds');let fp=hasFp?raw.finalPushAtSeconds:Math.round((build*.7)*100)/100;if(fp===''||fp==null)fp=null;else{fp=Number(fp);if(!Number.isFinite(fp)||fp<=0||fp>=build)fp=null;else fp=Math.round(fp*100)/100}
  const cleanAudio=x=>{x=x&&typeof x==='object'?x:{};return {fileId:String(x.fileId||''),name:String(x.name||''),mimeType:String(x.mimeType||''),duration:Number(x.duration)||0,updatedAt:String(x.updatedAt||'')}};

function normalizeManagementUpdates(raw={}){
  raw=raw&&typeof raw==='object'?raw:{};

  const cleanPost=(post,i)=>{post=post&&typeof post==='object'?post:{};const level=Math.max(1,Math.min(2,Number(post.authorAdminLevel)||1)),createdAt=String(post.createdAt||new Date().toISOString()),createdMs=Date.parse(createdAt)||Date.now(),ttl=level>=2?183:30;let expiresAt=String(post.expiresAt||'');if(!expiresAt)expiresAt=new Date(createdMs+ttl*86400000).toISOString();return {id:String(post.id||`mgmt-${i}`),authorUserName:String(post.authorUserName||''),authorDisplayName:String(post.authorDisplayName||post.authorUserName||'Management'),authorAdminLevel:level,createdAt,updatedAt:String(post.updatedAt||createdAt),expiresAt,pin:Number(post.pin)>=1&&Number(post.pin)<=5?Number(post.pin):null,driveFolderId:String(post.driveFolderId||''),blocks:(Array.isArray(post.blocks)?post.blocks:[]).map(cleanBlock)}};
  const deleted=(Array.isArray(raw.deletedIds)?raw.deletedIds:[]).map(x=>typeof x==='string'?{id:x,deletedAt:''}:{id:String(x?.id||''),deletedAt:String(x?.deletedAt||'')}).filter(x=>x.id);
  return {schemaVersion:1,enabled:!!raw.enabled,title:String(raw.title||'Management Updates').trim().slice(0,60)||'Management Updates',posts:(Array.isArray(raw.posts)?raw.posts:[]).map(cleanPost),deletedIds:deleted,updatedAt:String(raw.updatedAt||'')};

function mergeManagementUpdates(localRaw={},remoteRaw={}){
  const local=normalizeManagementUpdates(localRaw),remote=normalizeManagementUpdates(remoteRaw),tomb=new Map();
  for(const d of [...remote.deletedIds,...local.deletedIds]){const prev=tomb.get(d.id),at=Date.parse(d.deletedAt||0)||0;if(!prev||at>=(Date.parse(prev.deletedAt||0)||0))tomb.set(d.id,d)}
  const posts=new Map();for(const p of [...remote.posts,...local.posts]){const prev=posts.get(p.id);if(!prev||(Date.parse(p.updatedAt||0)||0)>=(Date.parse(prev.updatedAt||0)||0))posts.set(p.id,p)}

  mime=String(mime||'').toLowerCase();if(mime.includes('mpeg')||mime.includes('mp3'))return'mp3';if(mime.includes('wav'))return'wav';if(mime.includes('ogg'))return'ogg';if(mime.includes('mp4')||mime.includes('m4a')||mime.includes('aac'))return'm4a';if(mime.includes('webm'))return'webm';return'audio';

async function lotKeysAudioDuration(blob){

}

const DriveSync = (() => {
  const FOLDER_MIME = 'application/vnd.google-apps.folder';
  const SHEET_MIME = 'application/vnd.google-apps.spreadsheet';
  const DOC_MIME = 'application/vnd.google-apps.document';
  const DRIVE_SCOPE = 'openid email https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.readonly';
  let accessToken = '';
  let expiresAt = 0;

  let tokenClientId = '';

  const AUTH_SESSION_KEY = 'lotkeys-google-auth-v1';

  async function setting(id, def=''){ return (await DB.get('settings',id))?.value ?? def; }

  const LISTING_DELETE_TOMBSTONES='listingDeletionTombstonesV1';

      const w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
      if(!w||!h)throw new Error('That Store Logo has no readable dimensions.');
      if(w!==h)throw new Error(`Store Logo must be square (1:1). This image is ${w} × ${h}.`);
      const canvas=document.createElement('canvas');canvas.width=size;canvas.height=size;

      return blob;
    }finally{URL.revokeObjectURL(url)}

<script>

    const callForPrice=detectCallForPrice(text,expectedVehicle);if(callForPrice){out.priceStatus={value:'call-for-price',confidence:callForPrice.confidence,reason:callForPrice.reason};}else{const detectedPrice=detectVehiclePrice(text,extra,expectedVehicle);if(detectedPrice){add(out,'price',String(detectedPrice.price),detectedPrice.confidence,detectedPrice.reason);Object.assign(out.price,{ambiguous:detectedPrice.ambiguous===true,source:detectedPrice.source||'',label:detectedPrice.label||'',score:Number(detectedPrice.score)||0,alternatives:(detectedPrice.alternatives||[]).slice(0,4).map(x=>({price:x.price,score:x.score,reason:x.reason,source:x.source,label:x.label||''}))});}}
    const structuredMatch=[...(extra.structuredPrices||[])].map(x=>({x,score:vehicleTextMatchScore([x.name,x.vin,x.stock,x.url].join(' '),expectedVehicle)})).sort((a,b)=>b.score-a.score)[0];if(structuredMatch?.score>=250){if(structuredMatch.x.stock)add(out,'stock',String(structuredMatch.x.stock).toUpperCase(),'high','Stock number from matching structured vehicle data');if(structuredMatch.x.vin)add(out,'vin',String(structuredMatch.x.vin).toUpperCase(),'high','VIN from matching structured vehicle data');}
    let m;
    m=text.match(/(?:STK|STOCK)(?:\s*(?:#|NO\.?|NUMBER))?\s*[:#-]?\s*([A-Z0-9-]{3,20})/i);if(m)add(out,'stock',m[1].toUpperCase(),'high','Stock number on supplied page');
    const vins=text.toUpperCase().match(/\b[A-HJ-NPR-Z0-9]{17}\b/g)||[];if(vins.length)add(out,'vin',vins[0],'high','VIN on supplied page');
    m=text.match(/(?:Kilometers|Kilometres|Odometer|Mileage)\s*\n?\s*([0-9]{1,3}(?:,[0-9]{3})+|[0-9]{3,7})\s*(km|kms|mi|miles)?/i);if(!m)m=text.match(/\b([0-9]{1,3}(?:,[0-9]{3})+|[0-9]{4,7})\s*(km|kms|mi|miles)\b/i);if(m){add(out,'odometer',m[1].replace(/,/g,''),'high','Odometer on supplied page');add(out,'odometerUnit',/^mi/i.test(m[2]||'km')?'MI':'KM','high','Odometer unit on supplied page');}
    const heading=headingVehicle(text,extra.title);if(heading){add(out,'year',heading.year,'high','Year / Make / Model from the same vehicle heading line');add(out,'make',heading.make,'high','Year / Make / Model from the same vehicle heading line');add(out,'model',heading.model,'high','Year / Make / Model from the same vehicle heading line');}
    let desc=extra.description||section(text,'Vehicle details')||section(text,'Description');if(desc){desc=desc.replace(/View more.*$/i,'').trim();if(desc.length>40)add(out,'description',desc.slice(0,5000),'high','Vehicle description on supplied page');}
    const verifiedCarfax=carfaxReportUrl(extra.carfaxUrl,url);if(verifiedCarfax)add(out,'carfaxUrl',verifiedCarfax,'high','CARFAX vehicle-history report link on supplied page');return out;}
  async function fetchWithTimeout(url,options={},timeoutMs=8000){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeoutMs);try{return await fetch(url,{...options,signal:controller.signal})}finally{clearTimeout(timer)}}
  async function direct(url){const r=await fetchWithTimeout(url,{cache:'no-store',credentials:'omit'},7000);if(!r.ok)throw new Error(`Website returned ${r.status}`);const html=await r.text();const doc=new DOMParser().parseFromString(html,'text/html');const text=doc.body?.innerText||doc.documentElement?.innerText||html;const title=doc.title||'';const meta=doc.querySelector('meta[name="description"]')?.content||'';const carfax=extractCarfaxReportUrl(doc,html,url);return{mode:'direct',text,raw:html,title,description:meta,carfaxUrl:carfax,structuredPrices:structuredVehiclePrices(doc,html),images:extractImagesFromHtml(doc,html,url)};}

  async function scan(rawUrl,onProgress=()=>{},expectedVehicle={}){const url=urlOk(rawUrl);onProgress('Reading the exact vehicle page…');let src;try{src=await direct(url)}catch(e){onProgress('The dealership blocks direct browser reading — using the same URL through a read-only page fetch helper…');src=await reader(url)}onProgress('Finding vehicle information and photos…');const probed=await probeImages(src.images||[],onProgress);const fingerprinted=await fingerprintPhotos(probed.filter(plausiblePhoto),onProgress);const photos=classifyPhotos(fingerprinted);return{url,mode:src.mode,fields:parseText(src.text,url,src,expectedVehicle),photos,rawText:src.text};}
  async function scanFacts(rawUrl,onProgress=()=>{},expectedVehicle={}){const url=urlOk(rawUrl);onProgress('Reading the exact vehicle page…');let src;try{src=await direct(url)}catch(e){onProgress('Using the exact URL through the read-only page helper…');src=await reader(url)}return{url,mode:src.mode,fields:parseText(src.text,url,src,expectedVehicle),rawText:src.text};}
  async function imageBlob(url){try{const r=await fetch(url,{cache:'no-store'});if(r.ok){const b=await r.blob();if(b.type.startsWith('image/'))return b}}catch{}
    const proxy='https://images.weserv.nl/?url='+encodeURIComponent(url)+'&output=jpg';const r=await fetch(proxy,{cache:'no-store'});if(!r.ok)throw new Error('Photo download blocked');const b=await r.blob();if(!b.type.startsWith('image/'))throw new Error('Not an image');return b;}
  return{scan,scanFacts,imageBlob};
})();

at/i,53],['Power Adjustable Front Seats',/power[- ]adjustable (?:front )?seats|power front seats/i,54],['Premium Leather Seating',/leather (?:seat|seats|seating)|ARTICO/i,50],['48V Mild-Hybrid Technology',/48V|mild[- ]hybrid|e[- ]?torque/i,96]

  function features(text){const found=[];for(const [label,rx,rank] of FEATURE_RULES)if(rx.test(text))found.push({label,rank,confidence:'high',source:'Website / Profile description'});const wheel=String(text||'').match(/\b(1[7-9]|2[0-4])(?:[- ]?inch|\")\s+(?:[A-Za-z-]+\s+){0,3}(?:alloy )?wheels?/i);if(wheel)found.push({label:`${wheel[1]}\" Wheels`,rank:68,confidence:'high',source:'Website'});return [...new Map(found.map(x=>[x.label.toLowerCase(),x])).values()]}
  function parseSupplementary(rawText='',vehicle={}){const text=String(rawText||'');const engine=first(text,[/(?:^|\n)\s*Engine\s*(?:\n|:)\s*([^\n]{2,80})/i,/\b(\d\.\d\s*L\s+(?:I\d|V\d|Inline[- ]?\d|[3468]-Cylinder)[^\n,.]{0,55})/i]);const hp=first(text,[/(?:^|\n)\s*Horsepower\s*(?:\n|:)\s*(\d{2,4}\s*HP)/i,/\b(\d{2,4}\s*HP)\b/i]);const drivetrain=first(text,[/(?:^|\n)\s*Drivetrain\s*(?:\n|:)\s*([^\n]{2,35})/i,/\b(4MATIC|xDrive|quattro|AWD|4WD|FWD|RWD)\b/i]);const transmission=first(text,[/(?:^|\n)\s*Transmission\s*(?:\n|:)\s*([^\n]{2,60})/i,/\b(\d{1,2}[- ]Speed\s+(?:Automatic|Manual|DCT|CVT))\b/i]);const vehicleClass=detectClass(text,vehicle.model||'');return{engine,hp,drivetrain,transmission,vehicleClass,features:features(`${text}\n${vehicle.description||''}`)}}
  function makeModelLabel(make,model){make=norm(make);model=norm(model);if(make&&model.toLowerCase().startsWith(make.toLowerCase()+' '))return model;return [make,model].filter(Boolean).join(' ')}
  function conciseOverview(source,facts,sentences=3){let txt=norm(source||'').replace(/\s+/g,' ');if(txt){txt=txt.replace(/^(?:\d{4}\s+[^.!?]{0,100}[.!?-]\s*)/,'');const parts=txt.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[];const useful=parts.map(norm).filter(x=>x.length>30&&!/call us|contact us|book a test drive|visit .*today/i.test(x)).slice(0,Math.max(1,+sentences||3));if(useful.length)return useful.join(' ')}const bits=[];if(facts.odometer)bits.push(`with ${facts.odometer}`);if(facts.engineHp)bits.push(`powered by ${facts.engineHp}`);if(facts.drivetrain)bits.push(`${facts.drivetrain} capability`);const name=[facts.year,makeModelLabel(facts.make,facts.model)].filter(Boolean).join(' ');return `${name||'This vehicle'} is a well-equipped option ${bits.length?bits.join(', '):'with a strong mix of comfort, technology and everyday usability'}. Review the confirmed features below for the equipment included on this vehicle.`}
  function topFeatures(facts,approvedFeatures,count=5){const out=[];if(facts.odometerValue!==''&&Number(facts.odometerValue)<50000)out.push({label:`Only ${facts.odometer}`,rank:120});if(facts.hp)out.push({label:facts.engine?`${facts.hp} ${facts.engine}`:facts.hp,rank:112});if(facts.drivetrain&&/AWD|4WD|4MATIC|xDrive|quattro/i.test(facts.drivetrain))out.push({label:facts.drivetrain,rank:106});for(const f of approvedFeatures)out.push(f);return [...new Map(out.sort((a,b)=>(b.rank||0)-(a.rank||0)).map(x=>[x.label.toLowerCase(),x])).values()].slice(0,Math.max(1,+count||5))}
  function replaceVars(text,facts,userName){const make=norm(facts.make),rawModel=norm(facts.model),model=make&&rawModel.toLowerCase().startsWith(make.toLowerCase()+' ')?rawModel.slice(make.length).trim():rawModel;const vars={YEAR:facts.year,MAKE:make,MODEL:model,MAKE_MODEL:makeModelLabel(make,rawModel),ENGINE:facts.engine,HP:facts.hp,ENGINE_HP:facts.engineHp,ODOMETER:facts.odometer,CLASS:facts.vehicleClass,DRIVETRAIN:facts.drivetrain,TRANSMISSION:facts.transmission,VIN:facts.vin,STOCK:facts.stock,PRICE:facts.price,USER_NAME:userName||'Salesperson'};return String(text||'').replace(/\{\{([A-Z_]+)\}\}/g,(_,k)=>vars[k]||'').split('\n').map(line=>line.replace(/\s+\|\s+(?=\||$)/g,'').replace(/\|\s*\|/g,'|').replace(/[ \t]{2,}/g,' ').trim()).join('\n').trim()}
  function build(template,facts,approvedFeatures,userName){const pieces=[];for(const block of (template.blocks||[])){if(block.enabled===false)continue;const em=block.useEmojis!==false;const title=block.title||DescriptionTemplates.BLOCK_LABELS[block.type]||'';const heading=(emoji,label)=>`${em?emoji+' ':''}${label}`.trim();if(block.type==='headline'){const line=replaceVars(block.config?.pattern||'{{YEAR}} {{MAKE}} {{MODEL}} | {{ODOMETER}}',facts,userName);if(line)pieces.push(line)}else if(block.type==='details'){const rows=[];const selected=block.config?.fields||['year','makeModel','drivetrain','odometer','vin','stock'];const add=(key,emoji,label,val)=>{if(selected.includes(key)&&val)rows.push(`${em?emoji+' ':''}${label}: ${val}`)};add('year','🚗','Year',facts.year);add('makeModel','🚘','Make / Model',makeModelLabel(facts.make,facts.model));add('drivetrain','⚙️','Drivetrain',facts.drivetrain);add('odometer','📏','Odometer',facts.odometer);add('vin','🆔','VIN',facts.vin);add('stock','🔢','STK',facts.stock);if(rows.length)pieces.push(`${heading('📊',title)}\n${rows.join('\n')}`)}else if(block.type==='overview'){const ov=conciseOverview(facts.overviewSource,facts,block.config?.sentences||3);if(ov)pieces.push(`${heading('📁',title)}\n${ov}`)}else if(block.type==='features'){const lim=Math.max(1,+block.config?.limit||30),list=approvedFeatures.slice(0,lim).map(x=>`• ${x.label}`);if(list.length)pieces.push(`${heading('🔹',title)}\n${list.join('\n')}`)}else if(block.type==='topFeatures'){const list=topFeatures(facts,approvedFeatures,block.config?.count||5).map(x=>`${em?'⭐ ':'• '}${x.label}`);if(list.length)pieces.push(`${em?'':title?title+'\n':''}${em?'': ''}${list.join('\n')}`)}else if(block.type==='price'){const body=replaceVars(block.config?.text||'{{PRICE}} + GST',facts,userName);if(body)pieces.push(`${heading('💲',title)}\n${body}`)}else if(block.type==='financing'){let body=replaceVars(block.config?.text||'',facts,userName);if(body){body=body.split('\n').map(x=>x.trim()).filter   async function inspect(vehicle,draft,onProgress=()=>{}){let web=null,error='';if(vehicle?.originalListingUrl){try{onProgress('Checking the Vehicle Profile website for current facts…');web=await WebsiteInfo.scanFacts(vehicle.originalListingUrl,onProgress,vehicle)}catch(e){error=e.message||String(e)}}const supplement=parseSupplementary(web?.rawText||'',vehicle||{});const websitePrice=web?.fields?.price?.value?Number(web.fields.price.value):null,profilePrice=vehicle?.price!==''&&vehicle?.price!=null?Number(vehicle.price):draft.price!==''&&draft.price!=null?Number(draft.price):null;const discrepancies=[];if(websitePrice!=null&&profilePrice!=null&&Number.isFinite(websitePrice)&&Number.isFinite(profilePrice)&&websitePrice!==profilePrice)discrepancies.push(`Website currently shows ${money(websitePrice)}, while this Listing / Vehicle Profile shows ${money(profilePrice)}. LotKeys will keep the Profile price. Check the website and update the Vehicle Profile later if the change is correct.`);const facts={year:String(vehicle?.year||draft.year||''),make:String(vehicle?.make||draft.make||''),model:String(vehicle?.model||draft.model||''),price:money(profilePrice),priceValue:profilePrice??'',odometer:odo(vehicle?.odometer!==''&&vehicle?.odometer!=null?vehicle.odometer:draft.odometer,vehicle?.odometerUnit||draft.odometerUnit||'KM'),odometerValue:vehicle?.odometer!==''&&vehicle?.odometer!=null?vehicle.odometer:(draft.odometer??''),vin:String(vehicle?.vin||''),stock:String(vehicle?.stock||''),engine:supplement.engine,hp:supplement.hp,engineHp:[supplement.hp,supplement.engine].filter(Boolean).join(' ').trim(),drivetrain:supplement.drivetrain,transmission:supplement.transmission,vehicleClass:supplement.vehicleClass||'Vehicle',overviewSource:String(vehicle?.description||web?.fields?.description?.value||''),websiteUrl:vehicle?.originalListingUrl||'',websiteError:error};return{facts,features:supplement.features||[],discrepancies,website:web,error}}
  return{inspect,build};

  function bindPhotoReorder(container,onMove){
    if(!container)return;
    let from=null,activeTile=null,pointerId=null,lastTarget=null;
    const tiles=()=>[...container.querySelectorAll('.photo-tile')];
    const clearTargets=()=>container.querySelectorAll('.drop-target,.dragging').forEach(x=>x.classList.remove('drop-target','dragging'));
    const targetAt=(x,y)=>{
      const exact=document.elementFromPoint(x,y)?.closest?.('.photo-tile');
      if(exact&&container.contains(exact)&&exact!==activeTile)return exact;
      // On touch screens the finger can sit in the grid gap. Choose the closest tile center
      // so dropping between photos still feels natural.
      let best=null,bestDist=Infinity;
      for(const tile of tiles()){
        if(tile===activeTile)continue;
        const r=tile.getBoundingClientRect();
        const dx=x-(r.left+r.width/2),dy=y-(r.top+r.height/2),d=dx*dx+dy*dy;
        if(d<bestDist){bestDist=d;best=tile;}
      }
      return best;
    };
    const move=e=>{
      if(from===null||e.pointerId!==pointerId)return;
      e.preventDefault();
      container.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));
      lastTarget=targetAt(e.clientX,e.clientY);
      if(lastTarget)lastTarget.classList.add('drop-target');
    };
    const cleanup=()=>{
      document.removeEventListener('pointermove',move,true);
      document.removeEventListener('pointerup',finish,true);
      document.removeEventListener('pointercancel',cancel,true);
      document.body.style.removeProperty('user-select');
      document.body.style.removeProperty('-webkit-user-select');
    };
    const finish=e=>{
      if(from===null||e.pointerId!==pointerId)return;
      e.preventDefault();
      const under=targetAt(e.clientX,e.clientY)||lastTarget;
      const to=under?+under.dataset.pos:from;
      const old=from;
      clearTargets();cleanup();
      from=null;activeTile=null;pointerId=null;lastTarget=null;
      if(Number.isFinite(to)&&to!==old)onMove(old,to);
    };
    const cancel=e=>{
      if(from===null||(e.pointerId!=null&&e.pointerId!==pointerId))return;
      clearTargets();cleanup();
      from=null;activeTile=null;pointerId=null;lastTarget=null;
    };
    container.querySelectorAll('.drag-handle').forEach(handle=>{
      handle.onpointerdown=e=>{
        if(from!==null)return;
        const tile=handle.closest('.photo-tile');
        if(!tile)return;
        from=+tile.dataset.pos;activeTile=tile;pointerId=e.pointerId;lastTarget=null;
        tile.classList.add('dragging');
        document.body.style.userSelect='none';document.body.style.webkitUserSelect='none';
        handle.setPointerCapture?.(e.pointerId);
        document.addEventListener('pointermove',move,{capture:true,passive:false});
        document.addEventListener('pointerup',finish,{capture:true,passive:false});
        document.addEventListener('pointercancel',cancel,{capture:true,passive:false});
        e.preventDefault();e.stopPropagation();
      };
    });
  }

  function normalizeVehicleSearchText(value){return String(value||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
  function scoreVehicleSearch(v,q){
    const query=normalizeVehicleSearchText(q);if(!query)return 0;
    const tokens=query.split(/\s+/).filter(Boolean);
    const fields={year:normalizeVehicleSearchText(v.year),make:normalizeVehicleSearchText(v.make),model:normalizeVehicleSearchText(v.model),stock:normalizeVehicleSearchText(v.stock),vin:normalizeVehicleSearchText(v.vin),name:normalizeVehicleSearchText(v.name)};
    let total=0;
    for(const token of tokens){
      let best=0;
      for(const [key,val] of Object.entries(fields)){
        if(!val)continue;
        let score=0;
        if(val===token)score=12;
        else if(val.startsWith(token))score=9;
        else if(key==='year'&&val.endsWith(token))score=9;
        else if(val.includes(token))score=5;
        if((key==='stock'||key==='vin')&&val.includes(token))score+=3;
        if((key==='make'||key==='model')&&val.startsWith(token))score+=2;
        best=Math.max(best,score);
      }
      if(!best)return 0;
      total+=best;
    }
    const phrase=[fields.year,fields.make,fields.model,fields.stock].filter(Boolean).join(' ');
    if(phrase.includes(query))total+=8;
    return total;
  }
  function bestVehicleMatches(q,vehicles,limit=5){return (vehicles||[]).map(v=>({v,score:scoreVehicleSearch(v,q)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score||String(a.v.name||'').localeCompare(String(b.v.name||''))).slice(0,limit)}
